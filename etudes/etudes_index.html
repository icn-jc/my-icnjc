<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Études — My-ICN-JC</title>
<link rel="stylesheet" href="../assets/css/global.css"/>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<script src="../assets/js/firebase.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/sidebar.js"></script>
<style>
.etudes-table-wrap{background:var(--bg-card);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);border:1px solid var(--border);}
.scroll-sync-top{overflow-x:auto;overflow-y:hidden;height:10px;margin-bottom:2px;}
.scroll-sync-inner{height:1px;}
.tbl-scroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:900px;}
th{background:#f8f7f5;font-weight:600;font-size:10px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.07em;padding:9px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(27,42,74,0.02);cursor:pointer;}
.badge{padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;display:inline-block;}
.s-prospection{background:#e0f2fe;color:#0c4a6e;}
.s-signe{background:#dcfce7;color:#14532d;}
.s-encours{background:#fef3c7;color:#78350f;}
.s-livre{background:#dbeafe;color:#1e3a5f;}
.s-facture{background:#fce7f3;color:#831843;}
.s-cloture{background:#f1f5f9;color:#475569;}
.ref-badge{font-family:monospace;font-size:12px;font-weight:700;color:var(--bordeaux);background:var(--bordeaux-bg);padding:2px 7px;border-radius:var(--radius-sm);}
.kpi-strip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.kpi-mini{background:var(--bg-card);padding:10px 14px;border-radius:var(--radius-lg);border:1px solid var(--border);flex:1;min-width:100px;}
.kpi-mini-val{font-size:18px;font-weight:700;color:var(--navy);}
.kpi-mini-lbl{font-size:10px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.06em;}
.toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
.toolbar select,.toolbar input{padding:6px 10px;border-radius:var(--radius-md);border:1.5px solid var(--border-strong);font-family:Sora,sans-serif;font-size:12px;background:var(--white);}
/* Panel étude */
.etude-panel{position:fixed;right:0;top:0;bottom:0;width:520px;max-width:96vw;background:var(--white);box-shadow:-8px 0 40px rgba(27,42,74,0.18);z-index:400;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease;}
.etude-panel.open{transform:translateX(0);}
.ep-header{padding:18px 22px;border-bottom:1px solid var(--border);position:relative;}
.ep-ref{font-family:monospace;font-size:13px;font-weight:700;color:var(--bordeaux);}
.ep-title{font-family:'Playfair Display',serif;font-size:17px;color:var(--navy);margin-top:4px;}
.ep-close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-tertiary);}
.ep-body{flex:1;overflow-y:auto;padding:18px 22px;}
.ep-section{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-tertiary);margin-bottom:8px;margin-top:16px;display:flex;align-items:center;gap:8px;}
.ep-section::after{content:'';flex:1;height:1px;background:var(--border);}
.ep-section:first-child{margin-top:0;}
.overlay{position:fixed;inset:0;background:rgba(15,25,35,0.35);z-index:399;display:none;}
.overlay.open{display:block;}
.intervenant-chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--border);border-radius:99px;padding:4px 10px;font-size:12px;margin:3px;}
</style>
</head>
<body>
<div class="login-page" id="login-page">
  <div class="login-box">
    <div class="login-logo"><img src="../assets/images/ICN-Junior-Conseil_logo.png" style="height:54px;object-fit:contain"/></div>
    <div class="login-title">Connexion</div>
    <div class="login-sub">Accès réservé aux membres ICN Junior Conseil.</div>
    <button class="google-btn" onclick="doGoogleLogin()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google"/>Se connecter avec Google
    </button>
    <div class="denied-box" id="denied-box"><strong>Accès refusé</strong><p id="denied-msg"></p></div>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div class="app-page" id="app-page">
  <div id="sidebar-container"></div>
  <div class="app-content">
    <div class="page-header">
      <div class="flex justify-between items-center" style="flex-wrap:wrap;gap:10px">
        <div><div class="page-title">Études</div><div class="page-subtitle" id="page-subtitle"></div></div>
        <div class="flex gap-2">
          <button class="btn btn-primary btn-sm" id="btn-add" onclick="openAddModal()" style="display:none">+ Nouvelle étude</button>
          <button class="btn btn-secondary btn-sm" onclick="exportXLSX()">⬇ Excel</button>
        </div>
      </div>
    </div>
    <div class="page-body">
      <div class="kpi-strip" id="kpi-strip"></div>
      <div class="toolbar">
        <input type="text" id="srch" placeholder="🔍 Réf, titre, client…" oninput="render()"/>
        <select id="f-statut" onchange="render()">
          <option value="">Tous statuts</option>
          <option>Prospection</option><option>Signé</option><option>En cours</option>
          <option>Livré</option><option>Facturé</option><option>Clôturé</option>
        </select>
        <select id="f-mandat" onchange="render()"><option value="">Tous mandats</option></select>
        <select id="f-resp" onchange="render()"><option value="">Tous responsables</option></select>
        <button class="btn btn-secondary btn-sm" id="btn-filter-completer" onclick="toggleFilterCompleter()" style="background:#fef3c7;color:#78350f;border-color:#fde68a">⚠️ À compléter</button>
        <button class="btn btn-secondary btn-sm" onclick="clearFilters()">Réinitialiser</button>
        <span style="font-size:11px;color:var(--text-tertiary);font-style:italic" id="f-note"></span>
      </div>
      <div class="etudes-table-wrap">
        <div class="scroll-sync-top" id="sst"><div class="scroll-sync-inner" id="ssi"></div></div>
        <div class="tbl-scroll" id="ts">
          <table>
            <thead><tr>
              <th>Référence</th><th>Titre</th><th>Client</th><th>Type</th><th>Statut</th>
              <th>Montant HT</th><th>Responsable</th><th>Début</th><th>Fin</th>
            </tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closePanel()"></div>

<!-- PANNEAU ÉTUDE -->
<div class="etude-panel" id="etude-panel">
  <div class="ep-header">
    <div class="ep-ref" id="ep-ref"></div>
    <div class="ep-title" id="ep-title"></div>
    <div style="margin-top:6px;display:flex;gap:8px;flex-wrap:wrap" id="ep-meta"></div>
    <button class="ep-close" onclick="closePanel()">×</button>
  </div>
  <div class="ep-body" id="ep-body"></div>
</div>

<!-- MODAL AJOUT ÉTUDE -->
<div class="modal-overlay" id="modal-add" onclick="if(event.target===this)closeAdd()">
  <div class="modal-box" style="max-width:600px">
    <div class="modal-header"><div class="modal-title">Nouvelle étude</div><button class="modal-close" onclick="closeAdd()">×</button></div>
    <div class="form-grid">
      <div class="form-field full">
        <label class="input-label">Client *</label>
        <select class="select-field" id="ne-client" onchange="genRef()"><option value="">— Choisir —</option></select>
      </div>
      <div class="form-field full">
        <label class="input-label">Référence <span style="font-size:10px;color:var(--text-tertiary)">(générée auto, modifiable)</span></label>
        <input class="input" id="ne-ref" placeholder="Ex: 25ICN01"/>
      </div>
      <div class="form-field full"><label class="input-label">Titre *</label><input class="input" id="ne-title" placeholder="Intitulé de l'étude"/></div>
      <div class="form-field"><label class="input-label">Statut</label>
        <select class="select-field" id="ne-statut">
          <option>Prospection</option><option>Signé</option><option>En cours</option>
          <option>Livré</option><option>Facturé</option><option>Clôturé</option>
        </select></div>
      <div class="form-field"><label class="input-label">Montant HT (€)</label><input class="input" type="number" id="ne-montant" placeholder="0"/></div>
      <div class="form-field"><label class="input-label">Date signature</label><input class="input" type="date" id="ne-sign"/></div>
      <div class="form-field"><label class="input-label">Date début</label><input class="input" type="date" id="ne-debut"/></div>
      <div class="form-field"><label class="input-label">Date fin prévue</label><input class="input" type="date" id="ne-fin"/></div>
      <div class="form-field full">
        <label class="input-label">Type d'étude *</label>
        <select class="select-field" id="ne-type-etude">
          <option value="">— Choisir —</option>
          <optgroup label="Marché & Stratégie">
            <option>Étude de marché</option>
            <option>Étude de lancement de produit</option>
            <option>Benchmark</option>
            <option>Veille stratégique</option>
          </optgroup>
          <optgroup label="Marketing & Communication">
            <option>Étude de notoriété et image</option>
            <option>Plan de communication</option>
            <option>Étude de satisfaction client</option>
          </optgroup>
          <optgroup label="Finance & Audit">
            <option>Business plan</option>
            <option>Diagnostic RSE</option>
            <option>Visite mystère</option>
          </optgroup>
          <optgroup label="Affaires Publiques">
            <option>Sondage d'opinion</option>
          </optgroup>
        </select>
      </div>
      <div class="form-field full">
        <label class="input-label">Description de la mission *</label>
        <textarea class="input" id="ne-desc" rows="2" style="resize:vertical" placeholder="Contexte, objectifs, périmètre de la mission…"></textarea>
      </div>
      <div class="form-field full">
        <label class="input-label">Phases & JEH <span style="font-size:10px;color:var(--text-tertiary);font-weight:400">— générées depuis le type d'étude, ajustables</span></label>
        <div id="ne-phases-list" style="display:flex;flex-direction:column;gap:6px;margin-top:4px"></div>
        <button type="button" class="btn btn-secondary btn-sm" style="margin-top:8px" onclick="addCustomPhase()">+ Phase personnalisée</button>
        <div style="background:var(--bg);border-radius:var(--radius-md);padding:10px 14px;margin-top:10px;font-size:12px">
          <div style="display:flex;justify-content:space-between;margin-bottom:3px">
            <span style="color:var(--text-tertiary)">Total JEH</span>
            <span style="font-weight:700;color:var(--navy)" id="ne-total-jeh">0 JEH</span>
          </div>
          <div style="display:flex;justify-content:space-between;margin-bottom:3px">
            <span style="color:var(--text-tertiary)">Montant HT (facturé client)</span>
            <span style="font-weight:700;color:var(--bordeaux)" id="ne-total-ht">0 €</span>
          </div>
          <div style="display:flex;justify-content:space-between;margin-bottom:3px">
            <span style="color:var(--text-tertiary)">Rémunération brute intervenants (50%)</span>
            <span style="font-weight:600;color:var(--success)" id="ne-total-brut">0 €</span>
          </div>
          <div style="display:flex;justify-content:space-between">
            <span style="color:var(--text-tertiary)">Part JE (50%)</span>
            <span style="font-weight:600;color:var(--navy)" id="ne-total-je">0 €</span>
          </div>
        </div>
      </div>
      <div class="form-field full">
        <label class="input-label">Responsable</label>
        <select class="select-field" id="ne-resp"><option value="">— Choisir —</option></select>
      </div>
      <div class="form-field full"><label class="input-label">Notes</label><textarea class="input" id="ne-notes" rows="2" style="resize:vertical"></textarea></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeAdd()">Annuler</button>
      <button class="btn btn-primary" onclick="confirmAdd()">Créer l&#39;étude →</button>
    </div>
  </div>
</div>

<script>
var ME = '', MY_ROLE = '', CAN_EDIT = false;
var allEtudes = [], allClients = [], allUsers = [], allMandats = [];
var curEtudeId = null;
var EDIT_ROLES_E = ['super_admin','president','vice_president','responsable_commercial','responsable_qualite'];

var STATUT_CSS = {Prospection:'s-prospection',Signé:'s-signe','En cours':'s-encours',
  Livré:'s-livre',Facturé:'s-facture',Clôturé:'s-cloture'};

function localDateStr(d) { return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtD(s) { if (!s) return '—'; var p=s.split('-'); return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s; }
function fmtM(n) { return Number(n||0).toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:0})+' €'; }

initAuth('etudes', function(user, role, profile) {
  ME = user.email; MY_ROLE = role;
  CAN_EDIT = EDIT_ROLES_E.includes(role);
  renderSidebar(role, profile, user, 'etudes');
  showAppPage(user, role, profile);
  updateHealthIndicator();
  if (CAN_EDIT) document.getElementById('btn-add').style.display = 'flex';
  var now = new Date();
  var M=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  document.getElementById('page-subtitle').innerText = now.getDate()+' '+M[now.getMonth()]+' '+now.getFullYear();
  loadData();
});

function loadData() {
  db.collection('mandats').get().then(function(snap) {
    allMandats = [];
    snap.forEach(function(doc){allMandats.push(Object.assign({id:doc.id},doc.data()));});
    allMandats.sort(function(a,b){return (b.date_debut||'').localeCompare(a.date_debut||'');});
    var sel = document.getElementById('f-mandat');
    allMandats.forEach(function(m){var o=document.createElement('option');o.value=m.id;o.text=m.label;sel.appendChild(o);});
  });

  db.collection('users').get().then(function(snap) {
    allUsers = [];
    snap.forEach(function(doc){allUsers.push(Object.assign({email:doc.id},doc.data()));});
    var respSel = document.getElementById('f-resp');
    var neResp = document.getElementById('ne-resp');
    allUsers.filter(function(u){return ['super_admin','president','vice_president','responsable_commercial'].includes(u.role||'');}).forEach(function(u){
      var name = (u.prenom||'')+' '+(u.nom||'');
      var o1=document.createElement('option'); o1.value=u.email; o1.text=name; respSel.appendChild(o1);
      var o2=document.createElement('option'); o2.value=u.email; o2.text=name; neResp.appendChild(o2);
    });
  });

  db.collection('clients').get().then(function(snap) {
    allClients = [];
    snap.forEach(function(doc){allClients.push(Object.assign({id:doc.id},doc.data()));});
    var sel = document.getElementById('ne-client');
    allClients.sort(function(a,b){return (a.company_name||'').localeCompare(b.company_name||'');}).forEach(function(c){
      var o=document.createElement('option'); o.value=c.id; o.text=c.company_name||''; sel.appendChild(o);
    });
  });

  db.collection('etudes').onSnapshot(function(snap) {
    allEtudes = [];
    snap.forEach(function(doc){allEtudes.push(Object.assign({id:doc.id},doc.data()));});
    allEtudes.sort(function(a,b){return (b.created_at_str||'').localeCompare(a.created_at_str||'');});
    render();
    renderKPIs();
  });
}

function renderKPIs() {
  var total = allEtudes.length;
  var encours = allEtudes.filter(function(e){return e.statut==='En cours';}).length;
  var signes = allEtudes.filter(function(e){return e.statut==='Signé';}).length;
  var actives = allEtudes.filter(function(e){return ['Signé','En cours','Livré'].includes(e.statut);}).length;
  var ca = allEtudes.filter(function(e){return ['Signé','En cours','Livré','Facturé','Clôturé'].includes(e.statut);})
    .reduce(function(a,e){return a+(parseFloat(e.montant_ht)||0);},0);
  document.getElementById('kpi-strip').innerHTML =
    kpi('Études total',total)+kpi('Signées',signes,'kc-bordeaux')+
    kpi('En cours',encours,'kc-warn')+kpi('CA total',fmtM(ca),'kc-success');
}
function kpi(l,v,cls){ return '<div class="kpi-mini '+(cls||'')+'"><div class="kpi-mini-val">'+v+'</div><div class="kpi-mini-lbl">'+l+'</div></div>'; }

function render() {
  var srch = (document.getElementById('srch').value||'').toLowerCase();
  var fst = document.getElementById('f-statut').value;
  var fma = document.getElementById('f-mandat').value;
  var fre = document.getElementById('f-resp').value;
  var data = allEtudes.filter(function(e) {
    if (srch && !(e.reference||'').toLowerCase().includes(srch) && !(e.title||'').toLowerCase().includes(srch) && !(e.client_name||'').toLowerCase().includes(srch)) return false;
    if (fst && e.statut !== fst) return false;
    if (fma && e.mandat_id !== fma) return false;
    if (fre && e.responsable_email !== fre) return false;
    if (filterCompleter && !e.a_completer) return false;
    return true;
  });
  document.getElementById('f-note').innerText = data.length < allEtudes.length ? data.length+' / '+allEtudes.length : '';
  var html = data.length === 0
    ? '<tr><td colspan="8" style="text-align:center;padding:2rem;color:var(--text-tertiary)">Aucune étude.</td></tr>'
    : data.map(function(e) {
        var sc = STATUT_CSS[e.statut]||'';
        var resp = allUsers.find(function(u){return u.email===e.responsable_email;});
        var respName = resp ? (resp.prenom||'')+' '+(resp.nom||'') : (e.responsable_email||'—');
        return '<tr onclick="openEtude(\''+e.id+'\')">' +
          '<td><span class="ref-badge">'+(e.reference||'—')+'</span>' +
            (e.a_completer ? '<span style="background:#fef3c7;color:#78350f;font-size:9px;font-weight:700;padding:1px 6px;border-radius:99px;margin-left:4px;vertical-align:middle">À compléter</span>' : '') +
          '</td>' +
          '<td style="font-weight:600;color:var(--navy)">'+(e.title||'—')+'</td>' +
          '<td style="font-size:12px">'+(e.client_name||'—')+'</td>' +
          '<td style="font-size:11px;color:var(--text-tertiary)">'+(e.type_etude||'—')+'</td>' +
          '<td><span class="badge '+sc+'">'+(e.statut||'—')+'</span></td>' +
          '<td style="font-weight:600;color:var(--bordeaux)">'+(e.montant_ht?fmtM(e.montant_ht):'—')+'</td>' +
          '<td style="font-size:12px;color:var(--text-secondary)">'+respName+'</td>' +
          '<td style="font-size:11px;color:var(--text-tertiary)">'+fmtD(e.date_debut)+'</td>' +
          '<td style="font-size:11px;color:var(--text-tertiary)">'+fmtD(e.date_fin)+'</td>' +
          '<td style="font-size:11px;color:var(--text-tertiary)">'+(e.mandat_id||'—')+'</td>' +
        '</tr>';
      }).join('');
  document.getElementById('tbody').innerHTML = html;
  setTimeout(syncScroll, 80);
}

function syncScroll() {
  var tw=document.getElementById('ts'), sb=document.getElementById('sst'), si=document.getElementById('ssi');
  if (!tw||!sb||!si) return;
  si.style.width = tw.scrollWidth+'px';
  sb.onscroll = function(){tw.scrollLeft=sb.scrollLeft;};
  tw.onscroll = function(){sb.scrollLeft=tw.scrollLeft;};
}

var filterCompleter = false;
function toggleFilterCompleter() {
  filterCompleter = !filterCompleter;
  var btn = document.getElementById('btn-filter-completer');
  if (btn) {
    btn.style.background = filterCompleter ? '#f59e0b' : '#fef3c7';
    btn.style.color = filterCompleter ? 'white' : '#78350f';
  }
  render();
}
function clearFilters() {
  filterCompleter = false;
  var btn = document.getElementById('btn-filter-completer');
  if (btn) { btn.style.background='#fef3c7'; btn.style.color='#78350f'; }
  ['srch','f-statut','f-mandat','f-resp'].forEach(function(id){document.getElementById(id).value='';});
  render();
}

// ── Panel étude ───────────────────────────────────────────────
function openEtude(id) {
  var e = allEtudes.find(function(x){return x.id===id;});
  if (!e) return;
  curEtudeId = id;
  document.getElementById('ep-ref').innerText = e.reference||'—';
  document.getElementById('ep-title').innerText = e.title||'Sans titre';
  var sc = STATUT_CSS[e.statut]||'';
  document.getElementById('ep-meta').innerHTML =
    '<span class="badge '+sc+'">'+(e.statut||'—')+'</span>' +
    (e.client_name?'<span style="font-size:12px;color:var(--text-tertiary)">🏢 '+e.client_name+'</span>':'') +
    (e.montant_ht?'<span style="font-size:12px;font-weight:600;color:var(--bordeaux)">'+fmtM(e.montant_ht)+'</span>':'');

  var resp = allUsers.find(function(u){return u.email===e.responsable_email;});
  var respName = resp ? (resp.prenom||'')+' '+(resp.nom||'') : (e.responsable_email||'—');

  var intervenants = (e.intervenants||[]).map(function(iv) {
    return '<span class="intervenant-chip">👤 '+(iv.nom||iv.intervenant_id||'?')+
      (iv.montant_brut?' · '+fmtM(iv.montant_brut):'')+'</span>';
  }).join('');

  var canEdit = EDIT_ROLES_E.includes(MY_ROLE);
  var isSA = MY_ROLE === 'super_admin';
  var statOpts = ['Prospection','Signé','En cours','Livré','Facturé','Clôturé'].map(function(s){
    return '<option'+(e.statut===s?' selected':'')+'>'+s+'</option>';
  }).join('');

  // Avenant history
  var avenants = e.avenants || [];

function epField(label, val) {
  return '<div style="display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)">' +
    '<div style="font-size:12px;color:var(--text-tertiary);width:130px;flex-shrink:0">'+label+'</div>' +
    '<div style="font-size:13px;color:var(--text-primary)">'+val+'</div></div>';
}

function updEtude(id, field, val) {
  var u = {}; u[field] = val;
  // If user fills phases or date_debut, clear the a_completer flag
  if (['phases','date_debut','responsable_email'].includes(field) && val) {
    u.a_completer = false;
  }
  db.collection('etudes').doc(id).update(u);
}

function renderPhasesPanel(e, isSA, canEdit) {
  var phases = e.phases || [];
  if (!phases.length) {
    return '<div class="ep-section" style="margin-top:16px">Phases & JEH</div>' +
      '<div style="font-size:12px;color:var(--text-tertiary);font-style:italic">Aucune phase définie. ' +
      (isSA ? 'Modifie l\'étude pour ajouter des phases.' : '') + '</div>';
  }
  var calc = calcEtude(phases);
  var html = '<div class="ep-section" style="margin-top:16px">Phases & JEH — ' +
    fmtJEH(calc.jeh_total) + ' · ' + fmtM(calc.montant_ht) + ' HT</div>';

  // Financial summary
  html += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px">' +
    '<div style="background:rgba(163,33,95,0.06);border-radius:var(--radius-md);padding:10px;text-align:center">' +
      '<div style="font-size:18px;font-weight:800;color:var(--bordeaux)">' + fmtM(calc.montant_ht) + '</div>' +
      '<div style="font-size:10px;color:var(--text-tertiary);text-transform:uppercase">Facturé client</div>' +
    '</div>' +
    '<div style="background:rgba(34,197,94,0.08);border-radius:var(--radius-md);padding:10px;text-align:center">' +
      '<div style="font-size:18px;font-weight:800;color:#15803d">' + fmtM(calc.montant_brut_iv) + '</div>' +
      '<div style="font-size:10px;color:var(--text-tertiary);text-transform:uppercase">Brut intervenants (50%)</div>' +
    '</div>' +
    '<div style="background:rgba(27,42,74,0.06);border-radius:var(--radius-md);padding:10px;text-align:center">' +
      '<div style="font-size:18px;font-weight:800;color:var(--navy)">' + fmtM(calc.part_je) + '</div>' +
      '<div style="font-size:10px;color:var(--text-tertiary);text-transform:uppercase">Part JE (50%)</div>' +
    '</div>' +
  '</div>';

  // Phases list
  phases.forEach(function(ph) {
    var phCalc = calcPhase(ph);
    var ivList = (ph.intervenants||[]);
    var jehAssigned = ivList.reduce(function(a,i){return a+(parseFloat(i.jeh)||0);},0);
    var jehRestant = (ph.jeh_total||0) - jehAssigned;
    var isActif = ph.actif !== false;

    html += '<div style="border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px;margin-bottom:8px;opacity:'+(isActif?'1':'0.5')+';background:'+(isActif?'var(--bg-card)':'#f8f7f5')+'">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:8px">' +
        '<div>' +
          '<span style="font-weight:700;font-size:13px;color:var(--navy)">' + ph.label + '</span>' +
          (!isActif ? ' <span style="font-size:10px;color:var(--text-tertiary);font-style:italic">désactivée</span>' : '') +
          '<div style="font-size:10px;color:var(--text-tertiary);margin-top:1px">' + (ph.sub||'') + '</div>' +
        '</div>' +
        '<div style="text-align:right;font-size:12px">' +
          '<span style="font-weight:700;color:var(--bordeaux)">' + fmtM(phCalc.montant_total) + '</span>' +
          ' <span style="color:var(--text-tertiary)">(' + (ph.jeh_total||0) + ' JEH × ' + fmtM(ph.montant_jeh||0) + ')</span>' +
        '</div>' +
      '</div>';

    // Intervenants sur cette phase
    if (ivList.length > 0) {
      html += '<div style="display:flex;flex-direction:column;gap:4px;margin-bottom:8px">';
      ivList.forEach(function(iv) {
        var ivBrut = (iv.jeh||0) * (ph.montant_jeh||0) * 0.5;
        html += '<div style="display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:var(--radius-sm);padding:6px 10px;font-size:12px">' +
          '<div style="width:26px;height:26px;border-radius:50%;background:var(--bordeaux);color:white;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0">' +
            ((iv.nom||'?')[0]) +
          '</div>' +
          '<span style="flex:1;color:var(--navy);font-weight:600">' + (iv.nom||'') + '</span>' +
          '<span style="color:var(--text-tertiary)">' + (iv.jeh||0) + ' JEH</span>' +
          '<span style="color:var(--success);font-weight:600">' + fmtM(ivBrut) + '</span>' +
           (canEdit ? '<button data-eid="'+e.id+'" data-pid="'+ph.id+'" data-ivid="'+iv.intervenant_id+'" onclick="handleRemoveIv(this)" style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:12px;padding:0">×</button>' : '') +
        '</div>';
      });
      html += '</div>';
    }

    // JEH restants + bouton assigner
    if (isActif && canEdit) {
      html += '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
        '<span style="font-size:11px;color:' + (jehRestant < 0 ? 'var(--danger)' : jehRestant === 0 ? 'var(--success)' : 'var(--text-tertiary)') + '">' +
          (jehRestant < 0 ? '⚠️ Dépassement de ' + Math.abs(jehRestant) + ' JEH' :
           jehRestant === 0 ? '✅ JEH entièrement assignés' :
           jehRestant + ' JEH restants à assigner') +
        '</span>' +
        (jehRestant > 0 ?
          '<button data-eid="'+e.id+'" data-pid="'+ph.id+'" data-maxjeh="'+jehRestant+'" data-label="'+ph.label+'" data-montant="'+(ph.montant_jeh||0)+'" class="btn btn-secondary btn-sm" onclick="handleAssignPhase(this)" style="font-size:11px;padding:3px 10px">+ Assigner intervenant</button>'
          : '') +
      '</div>';
    }

    html += '</div>';
  });

  return html;
}

// ── Assigner intervenant à une phase ─────────────────────────
var curAssignEtudeId = null, curAssignPhaseId = null, curAssignMaxJeh = 0, curAssignMontantJeh = 0;

function handleRemoveIv(btn) {
  var eid = btn.dataset.eid;
  var pid = btn.dataset.pid;
  var ivid = btn.dataset.ivid;
  removeIvFromPhase(eid, pid, ivid);
}

function handleAssignPhase(btn) {
  var eid = btn.dataset.eid;
  var pid = btn.dataset.pid;
  var maxJeh = parseFloat(btn.dataset.maxjeh)||0;
  var label = btn.dataset.label;
  var montant = parseFloat(btn.dataset.montant)||0;
  openAssignPhase(eid, pid, maxJeh, label, montant);
}

function openAssignPhase(etudeId, phaseId, maxJeh, phaseLabel, montantJeh) {
  curAssignEtudeId = etudeId; curAssignPhaseId = phaseId;
  curAssignMaxJeh = maxJeh; curAssignMontantJeh = montantJeh;
  // Build modal dynamically
  var modal = document.getElementById('modal-assign-phase');
  if (!modal) {
    modal = document.createElement('div');
    modal.className = 'modal-overlay';
    modal.id = 'modal-assign-phase';
    modal.onclick = function(evt){if(evt.target===this)closeAssignPhase();};
    document.body.appendChild(modal);
  }
  var ivOptions = allIntervenants.map(function(iv){
    return '<option value="'+iv.id+'">'+iv.prenom+' '+iv.nom+'</option>';
  }).join('');
  modal.innerHTML =
    '<div class="modal-box" style="max-width:440px">' +
      '<div class="modal-header"><div class="modal-title">Assigner — '+phaseLabel+'</div>' +
        '<button class="modal-close" onclick="closeAssignPhase()">×</button></div>' +
      '<div class="form-grid">' +
        '<div class="form-field full"><label class="input-label">Intervenant</label>' +
          '<select class="select-field" id="ap-iv">'+ivOptions+'</select></div>' +
        '<div class="form-field"><label class="input-label">JEH à assigner (max '+maxJeh+')</label>' +
          '<input class="input" type="number" id="ap-jeh" min="0.5" step="0.5" max="'+maxJeh+'" placeholder="0" oninput="updateApCalc()"/></div>' +
        '<div class="form-field">' +
          '<label class="input-label">Rémunération brute</label>' +
          '<div style="padding:8px;background:var(--bg);border-radius:var(--radius-sm);font-weight:700;color:var(--success)" id="ap-remun">0 €</div>' +
        '</div>' +
        '<div class="form-field full" style="background:#fef3c7;border-radius:var(--radius-md);padding:8px 12px;font-size:11px;color:#78350f">' +
          '× montant JEH de la phase ('+fmtM(montantJeh)+') × 50% = rémunération brute intervenant' +
        '</div>' +
      '</div>' +
      '<div class="modal-actions">' +
        '<button class="btn btn-secondary" onclick="closeAssignPhase()">Annuler</button>' +
        '<button class="btn btn-primary" onclick="confirmAssignPhase()">Assigner →</button>' +
      '</div>' +
    '</div>';
  modal.classList.add('open');
}

function updateApCalc() {
  var jeh = parseFloat(document.getElementById('ap-jeh').value)||0;
  var remun = jeh * curAssignMontantJeh * 0.5;
  var el = document.getElementById('ap-remun');
  if (el) el.innerText = fmtM(remun);
}

function closeAssignPhase() {
  var modal = document.getElementById('modal-assign-phase');
  if (modal) modal.classList.remove('open');
}

function confirmAssignPhase() {
  var ivId = document.getElementById('ap-iv').value;
  var jeh = parseFloat(document.getElementById('ap-jeh').value)||0;
  if (!ivId || jeh <= 0) { alert('Sélectionne un intervenant et un nombre de JEH.'); return; }
  if (jeh > curAssignMaxJeh) { alert('Maximum ' + curAssignMaxJeh + ' JEH disponibles sur cette phase.'); return; }
  var iv = allIntervenants.find(function(x){return x.id===ivId;});
  if (!iv) return;
  var e = allEtudes.find(function(x){return x.id===curAssignEtudeId;});
  if (!e) return;
  var phases = JSON.parse(JSON.stringify(e.phases||[]));
  var phIdx = phases.findIndex(function(p){return p.id===curAssignPhaseId;});
  if (phIdx < 0) return;
  if (!phases[phIdx].intervenants) phases[phIdx].intervenants = [];
  // Check if already assigned to this phase
  var alreadyIdx = phases[phIdx].intervenants.findIndex(function(i){return i.intervenant_id===ivId;});
  var ivEntry = {
    intervenant_id: ivId,
    nom: (iv.prenom||'')+' '+(iv.nom||''),
    email: iv.email||'',
    jeh: jeh,
    montant_brut: jeh * (phases[phIdx].montant_jeh||0) * 0.5,
    statut: 'Assigné'
  };
  if (alreadyIdx >= 0) {
    phases[phIdx].intervenants[alreadyIdx] = ivEntry; // update existing
  } else {
    phases[phIdx].intervenants.push(ivEntry);
  }
  // Create RM document
  db.collection('documents').add({
    type: 'RM',
    etude_id: curAssignEtudeId,
    etude_ref: e.reference||'',
    phase_id: curAssignPhaseId,
    phase_label: phases[phIdx].label,
    intervenant_id: ivId,
    intervenant_nom: ivEntry.nom,
    nom_affiche: 'RM — '+(e.reference||'')+' — '+phases[phIdx].label+' — '+ivEntry.nom,
    lien_gdrive: '',
    statut: 'en_attente_lien',
    vu_par_intervenant: false,
    created_at: firebase.firestore.FieldValue.serverTimestamp()
  });
  // Update étude
  var recalc = calcEtude(phases);
  db.collection('etudes').doc(curAssignEtudeId).update({
    phases: phases,
    jeh_total_etude: recalc.jeh_total
  }).then(function(){
    closeAssignPhase();
    openEtude(curAssignEtudeId); // refresh panel
  });
}

function removeIvFromPhase(etudeId, phaseId, ivId) {
  if (!confirm('Retirer cet intervenant de la phase ?')) return;
  var e = allEtudes.find(function(x){return x.id===etudeId;});
  if (!e) return;
  var phases = JSON.parse(JSON.stringify(e.phases||[]));
  var phIdx = phases.findIndex(function(p){return p.id===phaseId;});
  if (phIdx < 0) return;
  phases[phIdx].intervenants = (phases[phIdx].intervenants||[]).filter(function(i){return i.intervenant_id!==ivId;});
  db.collection('etudes').doc(etudeId).update({phases:phases}).then(function(){
    openEtude(etudeId);
  });
}

function deleteEtude(id) {
  if (MY_ROLE !== 'super_admin') { alert('Suppression réservée au Super Admin.'); return; }
  if (!confirm('Supprimer cette étude ?')) return;
  db.collection('etudes').doc(id).delete().then(function(){closePanel();});
}

function updEtudeClient(id, clientId) {
  var client = allClients.find(function(c){return c.id===clientId;});
  if (!client) return;
  db.collection('etudes').doc(id).update({client_id:clientId, client_name:client.company_name||''});
}

function addAvenant(id) {
  var debut = document.getElementById('av-debut').value;
  var fin = document.getElementById('av-fin').value;
  var note = document.getElementById('av-note') ? document.getElementById('av-note').value.trim() : '';
  if (!debut || !fin) { alert('Merci de renseigner les deux dates de l\'avenant.'); return; }
  var e = allEtudes.find(function(x){return x.id===id;});
  if (!e) return;
  var avenants = JSON.parse(JSON.stringify(e.avenants||[]));
  avenants.push({
    date_avenant: new Date().toISOString().split('T')[0],
    date_debut: debut, date_fin: fin, note: note
  });
  db.collection('etudes').doc(id).update({
    avenants: avenants,
    date_debut: debut,
    date_fin: fin,
    statut: 'En cours'  // avenant → repasse En cours automatiquement
  }).then(function(){
    document.getElementById('av-debut').value = '';
    document.getElementById('av-fin').value = '';
    if (document.getElementById('av-note')) document.getElementById('av-note').value = '';
    alert('✅ Avenant enregistré. Statut repassé à "En cours".');
    openEtude(id); // refresh panel
  });
}

function closePanel() {
  document.getElementById('etude-panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
  curEtudeId = null;
}

// ── Génération référence ──────────────────────────────────────
function genRef() {
  var clientId = document.getElementById('ne-client').value;
  if (!clientId) return;
  var client = allClients.find(function(c){return c.id===clientId;});
  if (!client) return;
  var year = new Date().getFullYear().toString().slice(2);
  // 3 premières lettres du nom (pas les initiales)
  var name3 = (client.company_name||'').toUpperCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^A-Z0-9]/g,'')
    .slice(0,3);
  if (name3.length < 3) name3 = (name3 + 'XXX').slice(0,3);
  // Count existing studies for this client this year
  var existing = allEtudes.filter(function(e){
    return e.client_id === clientId && (e.reference||'').startsWith(year);
  }).length;
  var num = String(existing + 1).padStart(2,'0');
  document.getElementById('ne-ref').value = year + name3 + num;
}

function openAddModal() {

}
function closeAdd() { document.getElementById('modal-add').classList.remove('open'); }

function confirmAdd() {

  var title = document.getElementById('ne-title').value.trim();
  var ref = document.getElementById('ne-ref').value.trim();

  var montantVal = parseFloat(document.getElementById('ne-montant').value);
  if (!montantVal || montantVal <= 0) { alert('Le montant HT est obligatoire.'); return; }
  if (!ref) { genRef(); ref = document.getElementById('ne-ref').value.trim(); }

  var client = allClients.find(function(c){return c.id===clientId;});
  var actifMandat = allMandats.find(function(m){return m.statut==='actif';});

  db.collection('etudes').add({
    reference: ref,
    title: title,
    client_id: clientId,
    client_name: client ? client.company_name : '',
    statut: document.getElementById('ne-statut').value,
    montant_ht: parseFloat(document.getElementById('ne-montant').value)||0,
    montant_encaisse: 0,
    date_signature: document.getElementById('ne-sign').value||null,
    date_debut: document.getElementById('ne-debut').value||null,
    date_fin: document.getElementById('ne-fin').value||null,
    responsable_email: document.getElementById('ne-resp').value||ME,
    intervenants: [],
    mandat_id: actifMandat ? actifMandat.id : '',
    type_etude: document.getElementById('ne-type-etude').value,
    description: document.getElementById('ne-desc') ? document.getElementById('ne-desc').value.trim() : '',
    phases: nePhases.map(function(p){return Object.assign({},p,{intervenants:p.intervenants||[]});}),
    jeh_total_etude: calcEtude(nePhases).jeh_total,
    notes: document.getElementById('ne-notes').value.trim(),
    created_at_str: new Date().toISOString().split('T')[0],
    created_at: firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){ closeAdd(); });
}

function getTypeKey(t) {
  if (!t) return 'marche';
  var tl = (t||'').toLowerCase();
  if (tl.includes('march')||tl.includes('strat')||tl.includes('bench')||tl.includes('veille')||tl.includes('lancement')) return 'marche';
  if (tl.includes('market')||tl.includes('not')||tl.includes('satisf')||tl.includes('com')||tl.includes('plan')) return 'marketing';
  if (tl.includes('finan')||tl.includes('audit')||tl.includes('business')||tl.includes('rse')||tl.includes('myst')) return 'finance';
  if (tl.includes('public')||tl.includes('sondage')||tl.includes('opinion')) return 'affaires';
  return 'marche';
}

function buildDefaultPhases(typeKey) {
  var defs = PHASES_DEF[typeKey] || PHASES_DEF.marche;
  return defs.map(function(p) {
    return {id:p.id, label:p.label, sub:p.sub, ordre:defs.indexOf(p)+1,
            jeh_total:0, montant_jeh:0, actif:true, intervenants:[]};
  });
}

// ── Calculs financiers ────────────────────────────────────────
function calcPhase(ph) {
  var total = (ph.jeh_total||0) * (ph.montant_jeh||0);
  var brut_iv = total * 0.5;
  var part_je = total * 0.5;
  return {montant_total: total, montant_brut_iv: brut_iv, part_je: part_je};
}

function calcEtude(phases) {
  var jeh = 0, montant = 0, brut = 0, je = 0;
  (phases||[]).filter(function(p){return p.actif;}).forEach(function(p) {
    jeh += (p.jeh_total||0);
    var c = calcPhase(p);
    montant += c.montant_total;
    brut += c.montant_brut_iv;
    je += c.part_je;
  });
  return {jeh_total: jeh, montant_ht: montant, montant_brut_iv: brut, part_je: je};
}

function fmtM(n) { return Number(n||0).toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:0})+' €'; }
function fmtJEH(n) { return (n||0)+' JEH'; }


// ── Phase builder UI ──────────────────────────────────────────
var nePhases = [];

function onTypeEtudeChange() {
  var typeKey = getTypeKey(document.getElementById('ne-type-etude').value);
  nePhases = buildDefaultPhases(typeKey);
  renderNePhasesUI();
}

function renderNePhasesUI() {
  var container = document.getElementById('ne-phases-list');
  if (!container) return;
  container.innerHTML = nePhases.map(function(ph, i) {
    return '<div style="background:var(--bg);border-radius:var(--radius-md);padding:10px 12px;border:1px solid '+(ph.actif?'var(--border)':'#fca5a5')+';opacity:'+(ph.actif?'1':'0.6')+'" id="neph-'+i+'">' +
      '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
        '<input type="checkbox" checked="'+(ph.actif?'checked':'')+'" onchange="togglePhaseActif('+i+',this.checked)" style="accent-color:var(--bordeaux)"/>' +
        '<input style="flex:1;min-width:120px;padding:4px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:Sora,sans-serif;font-size:12px;font-weight:600" value="'+ph.label+'" onblur="updatePhaseLabel('+i+',this.value)"/>' +
        '<div style="display:flex;align-items:center;gap:6px;flex-shrink:0">' +
          '<input type="number" min="0" step="0.5" value="'+(ph.jeh_total||'')+'" placeholder="JEH" style="width:70px;padding:4px 6px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;font-family:Sora,sans-serif" oninput="updatePhaseJEH('+i+',this.value)"/>' +
          '<span style="font-size:11px;color:var(--text-tertiary)">×</span>' +
          '<input type="number" min="0" value="'+(ph.montant_jeh||'')+'" placeholder="€/JEH" style="width:80px;padding:4px 6px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;font-family:Sora,sans-serif" oninput="updatePhaseMontant('+i+',this.value)"/>' +
          '<span style="font-size:12px;font-weight:600;color:var(--bordeaux);min-width:70px;text-align:right" id="neph-total-'+i+'">'+fmtM(calcPhase(ph).montant_total)+'</span>' +
        '</div>' +
        (i > 5 ? '<button onclick="removeCustomPhase('+i+')" style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:14px;padding:0 2px">×</button>' : '') +
      '</div>' +
      '<div style="font-size:10px;color:var(--text-tertiary);margin-top:3px;padding-left:22px">'+ph.sub+'</div>' +
    '</div>';
  }).join('');
  updateNeTotals();
}

function togglePhaseActif(i, val) {
  nePhases[i].actif = val;
  renderNePhasesUI();
}
function updatePhaseLabel(i, val) { nePhases[i].label = val; }
function updatePhaseJEH(i, val) {
  nePhases[i].jeh_total = parseFloat(val)||0;
  var el = document.getElementById('neph-total-'+i);
  if (el) el.innerText = fmtM(calcPhase(nePhases[i]).montant_total);
  updateNeTotals();
}
function updatePhaseMontant(i, val) {
  nePhases[i].montant_jeh = parseFloat(val)||0;
  var el = document.getElementById('neph-total-'+i);
  if (el) el.innerText = fmtM(calcPhase(nePhases[i]).montant_total);
  updateNeTotals();
}
function addCustomPhase() {
  nePhases.push({id:'custom_'+Date.now(),label:'Phase personnalisée',sub:'',ordre:nePhases.length+1,jeh_total:0,montant_jeh:0,actif:true,intervenants:[]});
  renderNePhasesUI();
}
function removeCustomPhase(i) {
  nePhases.splice(i, 1);
  renderNePhasesUI();
}
function updateNeTotals() {
  var calc = calcEtude(nePhases);
  var jEl = document.getElementById('ne-total-jeh');
  var hEl = document.getElementById('ne-total-ht');
  var bEl = document.getElementById('ne-total-brut');
  var jeEl = document.getElementById('ne-total-je');
  if (jEl) jEl.innerText = calc.jeh_total + ' JEH';
  if (hEl) hEl.innerText = fmtM(calc.montant_ht);
  if (bEl) bEl.innerText = fmtM(calc.montant_brut_iv);
  if (jeEl) jeEl.innerText = fmtM(calc.part_je);
  // Sync montant HT field
  var mhtEl = document.getElementById('ne-montant');
  if (mhtEl && calc.montant_ht > 0) mhtEl.value = calc.montant_ht;
}

// Hook type change
document.addEventListener('DOMContentLoaded', function() {
  var sel = document.getElementById('ne-type-etude');
  if (sel) sel.addEventListener('change', onTypeEtudeChange);
});

function exportXLSX() {
  var rows = [['Référence','Titre','Client','Statut','Montant HT','Responsable','Date début','Date fin','Mandat']];
  allEtudes.forEach(function(e) {
    var resp = allUsers.find(function(u){return u.email===e.responsable_email;});
    rows.push([e.reference||'',e.title||'',e.client_name||'',e.statut||'',e.montant_ht||0,
      resp?(resp.prenom||'')+' '+(resp.nom||''):e.responsable_email||'',
      e.date_debut||'',e.date_fin||'',e.mandat_id||'']);
  });
  var ws = XLSX.utils.aoa_to_sheet(rows);
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Études');
  XLSX.writeFile(wb, 'Etudes_ICN_JC.xlsx');
}
