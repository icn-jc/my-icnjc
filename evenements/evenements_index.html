<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Événements — My-ICN-JC</title>
<link rel="stylesheet" href="../assets/css/global.css"/>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="../assets/js/firebase.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/sidebar.js"></script>
<style>
/* ── Tabs ── */
.ev-tabs { display:flex; gap:3px; background:var(--bg); border-radius:var(--radius-lg); padding:4px; border:1px solid var(--border); width:fit-content; margin-bottom:24px; }
.ev-tab { padding:8px 18px; border-radius:var(--radius-md); font-size:13px; font-weight:500; cursor:pointer; border:none; background:transparent; color:var(--text-secondary); font-family:'Sora',sans-serif; transition:all .2s; }
.ev-tab.active { background:var(--white); color:var(--bordeaux); box-shadow:var(--shadow-sm); font-weight:600; }
.ev-pane { display:none; }
.ev-pane.active { display:block; }

/* ── Calendrier ── */
.cal-header { display:flex; align-items:center; gap:16px; margin-bottom:16px; }
.cal-nav { background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-md); width:32px; height:32px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; color:var(--text-secondary); transition:all .15s; }
.cal-nav:hover { border-color:var(--bordeaux); color:var(--bordeaux); }
.cal-month { font-family:'Playfair Display',serif; font-size:20px; color:var(--navy); font-weight:700; }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
.cal-day-hdr { text-align:center; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--text-tertiary); padding:8px 4px; }
.cal-day { min-height:80px; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-md); padding:6px; transition:all .15s; cursor:default; }
.cal-day:hover { border-color:var(--bordeaux); }
.cal-day.today { border-color:var(--bordeaux); background:rgba(163,33,95,0.04); }
.cal-day.today .cal-day-num { background:var(--bordeaux); color:white; border-radius:50%; width:22px; height:22px; display:flex; align-items:center; justify-content:center; }
.cal-day.other-month { opacity:.35; }
.cal-day.has-event { cursor:pointer; }
.cal-day-num { font-size:12px; font-weight:600; color:var(--navy); width:22px; height:22px; display:flex; align-items:center; justify-content:center; }
.cal-ev-dot { border-radius:3px; padding:1px 5px; font-size:9px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; cursor:pointer; }
.cal-ev-interne { background:rgba(27,42,74,0.12); color:var(--navy); }
.cal-ev-externe { background:rgba(163,33,95,0.12); color:var(--bordeaux); }
.cal-ev-proposition { background:#fef3c7; color:#78350f; }

/* ── Event cards ── */
.ev-list { display:flex; flex-direction:column; gap:12px; }
.ev-card { background:var(--bg-card); border-radius:var(--radius-lg); padding:16px 20px; border:1px solid var(--border); box-shadow:var(--shadow-sm); display:flex; gap:16px; align-items:flex-start; transition:all .15s; cursor:pointer; }
.ev-card:hover { box-shadow:var(--shadow-md); border-color:var(--bordeaux); transform:translateX(2px); }
.ev-card.interne { border-left:3px solid var(--navy); }
.ev-card.externe { border-left:3px solid var(--bordeaux); }
.ev-date-block { background:var(--bg); border-radius:var(--radius-md); padding:8px 12px; text-align:center; min-width:52px; flex-shrink:0; }
.ev-date-day { font-size:22px; font-weight:800; color:var(--navy); line-height:1; }
.ev-date-month { font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-tertiary); }
.ev-info { flex:1; min-width:0; }
.ev-title { font-weight:700; font-size:14px; color:var(--navy); }
.ev-meta { font-size:12px; color:var(--text-tertiary); margin-top:3px; display:flex; gap:10px; flex-wrap:wrap; }
.ev-desc { font-size:12px; color:var(--text-secondary); margin-top:6px; line-height:1.5; }
.ev-type-badge { font-size:10px; font-weight:700; padding:2px 8px; border-radius:99px; }
.badge-interne { background:rgba(27,42,74,0.1); color:var(--navy); }
.badge-externe { background:rgba(163,33,95,0.1); color:var(--bordeaux); }

/* ── Propositions ── */
.prop-card { background:var(--bg-card); border-radius:var(--radius-lg); padding:16px 20px; border:1px solid var(--border); box-shadow:var(--shadow-sm); margin-bottom:12px; }
.prop-card.en_attente { border-left:3px solid #f59e0b; }
.prop-card.approuve { border-left:3px solid var(--success); }
.prop-card.refuse { border-left:3px solid var(--danger); opacity:.7; }
.prop-status { font-size:10px; font-weight:700; padding:2px 8px; border-radius:99px; }
.ps-attente { background:#fef3c7; color:#78350f; }
.ps-approuve { background:#dcfce7; color:#14532d; }
.ps-refuse { background:#fee2e2; color:#991b1b; }
.ps-discussion { background:#e0f2fe; color:#0c4a6e; }
.vote-row { display:flex; gap:8px; margin-top:12px; }

/* ── Panel ── */
.ev-panel { position:fixed; right:0; top:0; bottom:0; width:500px; max-width:96vw; background:var(--white); box-shadow:-8px 0 40px rgba(27,42,74,0.18); z-index:400; display:flex; flex-direction:column; transform:translateX(100%); transition:transform .25s ease; }
.ev-panel.open { transform:translateX(0); }
.evp-header { padding:20px 24px; border-bottom:1px solid var(--border); position:relative; }
.evp-close { position:absolute; top:16px; right:18px; background:none; border:none; font-size:22px; cursor:pointer; color:var(--text-tertiary); }
.evp-body { flex:1; overflow-y:auto; padding:20px 24px; }
.overlay { position:fixed; inset:0; background:rgba(15,25,35,.35); z-index:399; display:none; }
.overlay.open { display:block; }

/* ── Responsive cal ── */
@media(max-width:600px){.cal-day{min-height:50px;}.cal-ev-dot{display:none;}}
</style>
</head>
<body>
<div class="login-page" id="login-page">
  <div class="login-box">
    <div class="login-logo"><img src="../assets/images/ICN-Junior-Conseil_logo.png" style="height:54px;object-fit:contain"/></div>
    <div class="login-title">Connexion</div>
    <div class="login-sub">Accès réservé aux membres ICN Junior Conseil.</div>
    <button class="google-btn" onclick="doGoogleLogin()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google"/>Se connecter avec Google
    </button>
    <div class="denied-box" id="denied-box"><strong>Accès refusé</strong><p id="denied-msg"></p></div>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div class="app-page" id="app-page">
  <div id="sidebar-container"></div>
  <div class="app-content">
    <div class="page-header">
      <div class="flex justify-between items-center" style="flex-wrap:wrap;gap:10px">
        <div>
          <div class="page-title">Événements</div>
          <div class="page-subtitle" id="page-sub"></div>
        </div>
        <div class="flex gap-2">
          <button class="btn btn-secondary btn-sm" onclick="openPropModal()">💡 Proposer un événement</button>
          <button class="btn btn-primary btn-sm" id="btn-add-ev" onclick="openAddEv()" style="display:none">+ Événement</button>
        </div>
      </div>
    </div>
    <div class="page-body">
      <div class="ev-tabs">
        <button class="ev-tab active" onclick="switchTab('calendrier')" id="evt-cal">📅 Calendrier</button>
        <button class="ev-tab" onclick="switchTab('liste')" id="evt-list">📋 Liste</button>
        <button class="ev-tab" onclick="switchTab('propositions')" id="evt-prop">💡 Propositions <span id="prop-count-badge" style="display:none;background:var(--bordeaux);color:white;border-radius:99px;padding:1px 6px;font-size:10px;margin-left:4px"></span></button>
      </div>

      <!-- CALENDRIER -->
      <div class="ev-pane active" id="evp-calendrier">
        <div class="cal-header">
          <button class="cal-nav" onclick="prevMonth()">‹</button>
          <div class="cal-month" id="cal-title"></div>
          <button class="cal-nav" onclick="nextMonth()">›</button>
          <button class="btn btn-secondary btn-sm" onclick="goToday()">Aujourd'hui</button>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>

      <!-- LISTE -->
      <div class="ev-pane" id="evp-liste">
        <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
          <select id="lf-type" onchange="renderList()" style="padding:6px 10px;border-radius:var(--radius-md);border:1.5px solid var(--border-strong);font-family:'Sora',sans-serif;font-size:12px">
            <option value="">Tous types</option><option value="interne">Interne</option><option value="externe">Externe</option>
          </select>
          <select id="lf-period" onchange="renderList()" style="padding:6px 10px;border-radius:var(--radius-md);border:1.5px solid var(--border-strong);font-family:'Sora',sans-serif;font-size:12px">
            <option value="upcoming">À venir</option><option value="past">Passés</option><option value="all">Tous</option>
          </select>
          <input type="text" id="lf-search" placeholder="🔍 Rechercher…" oninput="renderList()" style="padding:6px 10px;border-radius:var(--radius-md);border:1.5px solid var(--border-strong);font-family:'Sora',sans-serif;font-size:12px;min-width:160px"/>
        </div>
        <div class="ev-list" id="ev-list"></div>
      </div>

      <!-- PROPOSITIONS -->
      <div class="ev-pane" id="evp-propositions">
        <div id="prop-list"></div>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closePanels()"></div>

<!-- PANNEAU ÉVÉNEMENT -->
<div class="ev-panel" id="ev-panel">
  <div class="evp-header">
    <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-tertiary);margin-bottom:4px" id="evp-type-lbl"></div>
    <div style="font-family:'Playfair Display',serif;font-size:18px;color:var(--navy)" id="evp-title"></div>
    <div style="font-size:12px;color:var(--text-tertiary);margin-top:4px" id="evp-date"></div>
    <button class="evp-close" onclick="closePanels()">×</button>
  </div>
  <div class="evp-body" id="evp-body"></div>
</div>

<!-- MODAL PROPOSITION -->
<div class="modal-overlay" id="modal-prop" onclick="if(event.target===this)closePropModal()">
  <div class="modal-box" style="max-width:580px">
    <div class="modal-header"><div class="modal-title">💡 Proposer un événement</div><button class="modal-close" onclick="closePropModal()">×</button></div>
    <p style="font-size:12px;color:var(--text-tertiary);margin-bottom:14px">Ta proposition sera soumise au CA pour décision. Sois précis sur le budget et la valeur apportée.</p>
    <div class="form-grid">
      <div class="form-field full"><label class="input-label">Titre de l'événement *</label><input class="input" id="np-title" placeholder="Forum Entreprises Nancy 2026…"/></div>
      <div class="form-field"><label class="input-label">Type</label>
        <select class="select-field" id="np-type"><option value="externe">Externe</option><option value="interne">Interne</option></select></div>
      <div class="form-field"><label class="input-label">Date envisagée</label><input class="input" type="date" id="np-date"/></div>
      <div class="form-field"><label class="input-label">Lieu</label><input class="input" id="np-lieu" placeholder="Nancy, en ligne…"/></div>
      <div class="form-field full"><label class="input-label">Description & objectif *</label><textarea class="input" id="np-desc" rows="3" style="resize:vertical" placeholder="Décris l'événement et la valeur apportée à la JE…"></textarea></div>
      <div class="form-field full">
        <label class="input-label">Budget prévisionnel</label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px" id="budget-grid">
          <div><label class="input-label" style="font-size:10px">Inscription / entrée (€)</label><input class="input" type="number" id="bgt-inscription" placeholder="0"/></div>
          <div><label class="input-label" style="font-size:10px">Transport (€)</label><input class="input" type="number" id="bgt-transport" placeholder="0"/></div>
          <div><label class="input-label" style="font-size:10px">Hébergement (€)</label><input class="input" type="number" id="bgt-hebergement" placeholder="0"/></div>
          <div><label class="input-label" style="font-size:10px">Autre (€)</label><input class="input" type="number" id="bgt-autre" placeholder="0"/></div>
        </div>
        <div style="font-size:12px;color:var(--navy);font-weight:600;margin-top:8px">Total estimé : <span id="bgt-total">0 €</span></div>
      </div>
      <div class="form-field full"><label class="input-label">Pourquoi cette proposition ? (argumentaire)</label><textarea class="input" id="np-argu" rows="2" style="resize:vertical" placeholder="En quoi cet événement bénéficierait à la JE…"></textarea></div>
      <div class="form-field"><label class="input-label">Nb participants estimés</label><input class="input" type="number" id="np-nb" placeholder="0"/></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closePropModal()">Annuler</button>
      <button class="btn btn-primary" onclick="submitProp()">Soumettre →</button>
    </div>
  </div>
</div>

<!-- MODAL CRÉER ÉVÉNEMENT (CA) -->
<div class="modal-overlay" id="modal-add-ev" onclick="if(event.target===this)closeAddEv()">
  <div class="modal-box" style="max-width:560px">
    <div class="modal-header"><div class="modal-title">Créer un événement</div><button class="modal-close" onclick="closeAddEv()">×</button></div>
    <div class="form-grid">
      <div class="form-field full"><label class="input-label">Titre *</label><input class="input" id="ne-title"/></div>
      <div class="form-field"><label class="input-label">Type</label>
        <select class="select-field" id="ne-type"><option value="interne">Interne</option><option value="externe">Externe</option></select></div>
      <div class="form-field"><label class="input-label">Date *</label><input class="input" type="date" id="ne-date"/></div>
      <div class="form-field"><label class="input-label">Heure début</label><input class="input" type="time" id="ne-heure"/></div>
      <div class="form-field"><label class="input-label">Heure fin</label><input class="input" type="time" id="ne-heure-fin"/></div>
      <div class="form-field"><label class="input-label">Lieu</label><input class="input" id="ne-lieu" placeholder="ICN, en ligne…"/></div>
      <div class="form-field full"><label class="input-label">Description</label><textarea class="input" id="ne-desc" rows="2" style="resize:vertical"></textarea></div>
      <div class="form-field"><label class="input-label">Budget (€)</label><input class="input" type="number" id="ne-budget" placeholder="0"/></div>
      <div class="form-field">
        <label class="input-label">Visibilité</label>
        <select class="select-field" id="ne-visib">
          <option value="tous">Tous les membres</option>
          <option value="ca">CA uniquement</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeAddEv()">Annuler</button>
      <button class="btn btn-primary" onclick="confirmAddEv()">Créer →</button>
    </div>
  </div>
</div>

<script>
var ME = '', MY_ROLE = '', MY_NAME = '', IS_CA_EV = false;
var allEvents = [], allProps = [];
var calYear, calMonth, today = new Date();
var curEvId = null;
var CA_ROLES_EV = ['super_admin','president','vice_president','tresorier','secretaire',
  'responsable_commercial','responsable_qualite','responsable_marketing','tresorerie','auditeur','marketing'];

var MOIS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
var MOIS_S = ['jan','fév','mar','avr','mai','jun','jul','aoû','sep','oct','nov','déc'];

function localDateStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtD(s){if(!s)return'—';var p=s.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s;}
function fmtM(n){return Number(n||0).toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:0})+' €';}

initAuth('evenements', function(user, role, profile) {
  ME = user.email; MY_ROLE = role;
  MY_NAME = ((profile.prenom||'') + ' ' + (profile.nom||'')).trim();
  IS_CA_EV = CA_ROLES_EV.includes(role);
  renderSidebar(role, profile, user, 'evenements');
  showAppPage(user, role, profile);
  updateHealthIndicator();
  if (IS_CA_EV) document.getElementById('btn-add-ev').style.display = 'flex';
  calYear = today.getFullYear(); calMonth = today.getMonth();
  var M=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  document.getElementById('page-sub').innerText = today.getDate()+' '+M[today.getMonth()]+' '+today.getFullYear();
  loadData();
  // Budget calcul live
  ['bgt-inscription','bgt-transport','bgt-hebergement','bgt-autre'].forEach(function(id){
    var el=document.getElementById(id);
    if(el) el.addEventListener('input', updateBudgetTotal);
  });
});

function loadData() {
  db.collection('evenements').orderBy('date').onSnapshot(function(snap){
    allEvents = [];
    snap.forEach(function(doc){allEvents.push(Object.assign({id:doc.id},doc.data()));});
    // Filtrer selon visibilité
    allEvents = allEvents.filter(function(e){
      if(e.visibilite==='ca') return IS_CA_EV;
      return true;
    });
    renderCalendar();
    renderList();
  });
  db.collection('propositions_evenements').orderBy('created_at','desc').onSnapshot(function(snap){
    allProps = [];
    snap.forEach(function(doc){allProps.push(Object.assign({id:doc.id},doc.data()));});
    renderProps();
    var pending = allProps.filter(function(p){return p.statut==='en_attente';}).length;
    var badge = document.getElementById('prop-count-badge');
    if(pending>0){badge.style.display='';badge.innerText=pending;}else{badge.style.display='none';}
  });
}

function switchTab(key) {
  ['calendrier','liste','propositions'].forEach(function(k){
    document.getElementById('evt-'+k.slice(0,3)+(k==='calendrier'?'cal':k==='liste'?'list':'prop')).classList.toggle('active',k===key);
    document.getElementById('evp-'+k).classList.toggle('active',k===key);
  });
  // Fix tab ids
  var tabMap = {calendrier:'cal',liste:'list',propositions:'prop'};
  ['calendrier','liste','propositions'].forEach(function(k){
    var el=document.getElementById('evt-'+tabMap[k]);
    if(el) el.classList.toggle('active',k===key);
    var pe=document.getElementById('evp-'+k);
    if(pe) pe.classList.toggle('active',k===key);
  });
}

// ══════════════════════════════════════════════════════════════
// CALENDRIER
// ══════════════════════════════════════════════════════════════
function renderCalendar() {
  document.getElementById('cal-title').innerText = MOIS[calMonth]+' '+calYear;
  var firstDay = new Date(calYear, calMonth, 1);
  var lastDay  = new Date(calYear, calMonth+1, 0);
  var startDow = (firstDay.getDay()+6)%7; // Lundi=0
  var DAYS = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
  var html = DAYS.map(function(d){return '<div class="cal-day-hdr">'+d+'</div>';}).join('');

  // Jours mois précédent
  for(var i=0;i<startDow;i++){
    var d2=new Date(calYear,calMonth,1-startDow+i);
    html+='<div class="cal-day other-month"><div class="cal-day-num">'+d2.getDate()+'</div></div>';
  }

  // Jours du mois
  for(var day=1;day<=lastDay.getDate();day++){
    var dateStr=calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    var isToday = calYear===today.getFullYear()&&calMonth===today.getMonth()&&day===today.getDate();
    var dayEvs = allEvents.filter(function(e){return e.date===dateStr;});
    var dotHtml = dayEvs.slice(0,3).map(function(e){
      var cls = e.type==='externe'?'cal-ev-externe':'cal-ev-interne';
      return '<div class="cal-ev-dot '+cls+'" onclick="openEv(\''+e.id+'\')" title="'+escHtml(e.title)+'">'+escHtml(e.title)+'</div>';
    }).join('');
    html+='<div class="cal-day'+(isToday?' today':'')+(dayEvs.length?' has-event':'')+'">' +
      '<div class="cal-day-num">'+day+'</div>'+dotHtml+'</div>';
  }

  // Jours mois suivant
  var endDow=(lastDay.getDay()+6)%7;
  for(var j=1;j<=(endDow===6?0:6-endDow);j++){
    html+='<div class="cal-day other-month"><div class="cal-day-num">'+j+'</div></div>';
  }
  document.getElementById('cal-grid').innerHTML=html;
}

function prevMonth(){calMonth--;if(calMonth<0){calMonth=11;calYear--;}renderCalendar();}
function nextMonth(){calMonth++;if(calMonth>11){calMonth=0;calYear++;}renderCalendar();}
function goToday(){calYear=today.getFullYear();calMonth=today.getMonth();renderCalendar();}

// ══════════════════════════════════════════════════════════════
// LISTE
// ══════════════════════════════════════════════════════════════
function renderList() {
  var ft=document.getElementById('lf-type').value;
  var fp=document.getElementById('lf-period').value;
  var fs=(document.getElementById('lf-search').value||'').toLowerCase();
  var todayStr=localDateStr(today);
  var data=allEvents.filter(function(e){
    if(ft&&e.type!==ft)return false;
    if(fp==='upcoming'&&e.date<todayStr)return false;
    if(fp==='past'&&e.date>=todayStr)return false;
    if(fs&&!(e.title||'').toLowerCase().includes(fs)&&!(e.lieu||'').toLowerCase().includes(fs))return false;
    return true;
  });
  data.sort(function(a,b){return fp==='past'?(b.date||'').localeCompare(a.date||''):(a.date||'').localeCompare(b.date||'');});
  if(data.length===0){
    document.getElementById('ev-list').innerHTML='<div style="color:var(--text-tertiary);font-size:13px;text-align:center;padding:30px">Aucun événement.</div>';
    return;
  }
  document.getElementById('ev-list').innerHTML=data.map(function(e){
    var p=e.date?e.date.split('-'):null;
    var day=p?p[2]:'?'; var mo=p?MOIS_S[parseInt(p[1])-1]:'';
    var typCls=e.type==='externe'?'externe':'interne';
    var typBadge=e.type==='externe'?'badge-externe':'badge-interne';
    var typLabel=e.type==='externe'?'Externe':'Interne';
    return '<div class="ev-card '+typCls+'" onclick="openEv(\''+e.id+'\')">' +
      '<div class="ev-date-block"><div class="ev-date-day">'+day+'</div><div class="ev-date-month">'+mo+'</div></div>' +
      '<div class="ev-info">' +
        '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
          '<div class="ev-title">'+escHtml(e.title||'')+'</div>' +
          '<span class="ev-type-badge '+typBadge+'">'+typLabel+'</span>' +
        '</div>' +
        '<div class="ev-meta">' +
          (e.lieu?'<span>📍 '+escHtml(e.lieu)+'</span>':'') +
          (e.heure?'<span>🕐 '+e.heure+(e.heure_fin?' → '+e.heure_fin:'')+'</span>':'') +
          (e.budget?'<span>💶 '+fmtM(e.budget)+'</span>':'') +
        '</div>' +
        (e.description?'<div class="ev-desc">'+escHtml(e.description.slice(0,120))+(e.description.length>120?'…':'')+'</div>':'') +
      '</div>' +
    '</div>';
  }).join('');
}

// ══════════════════════════════════════════════════════════════
// PROPOSITIONS
// ══════════════════════════════════════════════════════════════
function renderProps() {
  var canDecide = ['super_admin','president','vice_president'].includes(MY_ROLE);
  if(allProps.length===0){
    document.getElementById('prop-list').innerHTML='<div style="color:var(--text-tertiary);font-size:13px;text-align:center;padding:30px">Aucune proposition.</div>';
    return;
  }
  document.getElementById('prop-list').innerHTML=allProps.map(function(p){
    var sc={en_attente:'en_attente',approuve:'approuve',refuse:'refuse',en_discussion:'en_attente'}[p.statut]||'en_attente';
    var sbCls={en_attente:'ps-attente',approuve:'ps-approuve',refuse:'ps-refuse',en_discussion:'ps-discussion'}[p.statut]||'ps-attente';
    var sbTxt={en_attente:'⏳ En attente',approuve:'✅ Approuvé',refuse:'❌ Refusé',en_discussion:'💬 En discussion'}[p.statut]||'⏳ En attente';
    var bgtTotal=(parseFloat(p.budget_inscription||0)+parseFloat(p.budget_transport||0)+parseFloat(p.budget_hebergement||0)+parseFloat(p.budget_autre||0));
    var actionBtns='';
    if(canDecide&&p.statut==='en_attente'){
      actionBtns='<div class="vote-row">' +
        '<button class="btn btn-secondary btn-sm" onclick="decideProposition(\''+p.id+'\',\'en_discussion\')">💬 En discussion</button>' +
        '<button class="btn btn-primary btn-sm" style="background:var(--success);border-color:var(--success)" onclick="decideProposition(\''+p.id+'\',\'approuve\')">✅ Approuver</button>' +
        '<button class="btn btn-secondary btn-sm" style="background:#fee2e2;color:#991b1b;border-color:#fca5a5" onclick="decideProposition(\''+p.id+'\',\'refuse\')">❌ Refuser</button>' +
      '</div>';
    }
    if(canDecide&&p.statut==='approuve'){
      actionBtns='<div class="vote-row"><button class="btn btn-primary btn-sm" onclick="createEvFromProp(\''+p.id+'\')">📅 Créer l\'événement</button></div>';
    }
    return '<div class="prop-card '+sc+'">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:10px">' +
        '<div>' +
          '<div style="font-weight:700;font-size:14px;color:var(--navy)">'+escHtml(p.title||'')+'</div>' +
          '<div style="font-size:11px;color:var(--text-tertiary);margin-top:2px">'+
            'Par '+escHtml(p.propose_par||'')+(p.date_souhaitee?' · '+fmtD(p.date_souhaitee):'')+(p.lieu?' · 📍'+escHtml(p.lieu):'')+'</div>' +
        '</div>' +
        '<span class="prop-status '+sbCls+'">'+sbTxt+'</span>' +
      '</div>' +
      (p.description?'<div style="font-size:13px;color:var(--text-secondary);line-height:1.5;margin-bottom:8px">'+escHtml(p.description)+'</div>':'') +
      (p.argumentaire?'<div style="background:var(--bg);border-radius:var(--radius-sm);padding:8px 10px;font-size:12px;color:var(--text-secondary);margin-bottom:8px"><strong>Argumentaire :</strong> '+escHtml(p.argumentaire)+'</div>':'') +
      (bgtTotal>0?'<div style="font-size:12px;color:var(--navy);font-weight:600;margin-bottom:8px">💶 Budget estimé : '+fmtM(bgtTotal)+
        '<span style="font-size:11px;font-weight:400;color:var(--text-tertiary)"> (inscription:'+fmtM(p.budget_inscription||0)+
        ' · transport:'+fmtM(p.budget_transport||0)+' · héberg.:'+fmtM(p.budget_hebergement||0)+' · autre:'+fmtM(p.budget_autre||0)+')</span></div>':'') +
      actionBtns +
      (canDecide&&p.statut!=='refuse'?'<div style="margin-top:8px"><input class="input" id="note-'+p.id+'" placeholder="Note de décision / commentaire…" style="font-size:12px"/><button class="btn btn-secondary btn-sm" style="margin-top:6px" onclick="saveNote(\''+p.id+'\')">Enregistrer la note</button></div>':'') +
      (p.note_decision?'<div style="font-size:11px;font-style:italic;color:var(--text-tertiary);margin-top:6px">Note : '+escHtml(p.note_decision)+'</div>':'') +
    '</div>';
  }).join('');
}

function decideProposition(id,statut){
  db.collection('propositions_evenements').doc(id).update({statut:statut,decide_par:ME,decide_le:localDateStr(today)});
}

function saveNote(id){
  var inp=document.getElementById('note-'+id);
  if(!inp||!inp.value.trim())return;
  db.collection('propositions_evenements').doc(id).update({note_decision:inp.value.trim()});
}

function createEvFromProp(propId){
  var p=allProps.find(function(x){return x.id===propId;});
  if(!p)return;
  db.collection('evenements').add({
    title:p.title,type:p.type||'externe',date:p.date_souhaitee||'',lieu:p.lieu||'',
    description:p.description||'',budget:parseFloat(p.budget_inscription||0)+parseFloat(p.budget_transport||0)+parseFloat(p.budget_hebergement||0)+parseFloat(p.budget_autre||0),
    heure:'',heure_fin:'',visibilite:'tous',created_by:ME,
    from_proposition:propId,created_at:firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    db.collection('propositions_evenements').doc(propId).update({statut:'approuve',evenement_cree:true});
    alert('✅ Événement créé depuis la proposition.');
  });
}

// ══════════════════════════════════════════════════════════════
// PANEL ÉVÉNEMENT
// ══════════════════════════════════════════════════════════════
function openEv(id) {
  var e=allEvents.find(function(x){return x.id===id;});
  if(!e)return;
  curEvId=id;
  document.getElementById('evp-type-lbl').innerText=(e.type==='externe'?'Événement externe':'Événement interne');
  document.getElementById('evp-title').innerText=e.title||'';
  document.getElementById('evp-date').innerText=fmtD(e.date)+(e.heure?' · '+e.heure+(e.heure_fin?' → '+e.heure_fin:''):'')+(e.lieu?' · 📍 '+e.lieu:'');
  var canEdit=IS_CA_EV;
  document.getElementById('evp-body').innerHTML=
    (e.description?'<p style="font-size:14px;color:var(--text-secondary);line-height:1.7;margin-bottom:16px">'+escHtml(e.description)+'</p>':'') +
    '<div style="display:flex;flex-direction:column;gap:8px">' +
    fld('Type',e.type==='externe'?'Externe':'Interne') +
    fld('Date',fmtD(e.date)) +
    fld('Horaire',(e.heure||'Non défini')+(e.heure_fin?' → '+e.heure_fin:'')) +
    fld('Lieu',e.lieu||'—') +
    fld('Budget',e.budget?fmtM(e.budget):'—') +
    fld('Visibilité',e.visibilite==='ca'?'CA uniquement':'Tous les membres') +
    fld('Créé par',e.created_by||'—') +
    '</div>' +
    (canEdit?'<div style="margin-top:16px;display:flex;gap:8px">' +
      '<button class="btn btn-secondary btn-sm" onclick="editEv(\''+id+'\')">✏ Modifier</button>' +
      '<button class="btn btn-secondary btn-sm" style="background:#fee2e2;color:#991b1b;border-color:#fca5a5" onclick="deleteEv(\''+id+'\')">🗑 Supprimer</button>' +
    '</div>':'');
  document.getElementById('ev-panel').classList.add('open');
  document.getElementById('overlay').classList.add('open');
}

function fld(l,v){
  return '<div style="display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)">' +
    '<div style="font-size:12px;color:var(--text-tertiary);width:100px;flex-shrink:0">'+l+'</div>' +
    '<div style="font-size:13px;color:var(--text-primary)">'+v+'</div></div>';
}

function deleteEv(id){
  if(!confirm('Supprimer cet événement ?'))return;
  db.collection('evenements').doc(id).delete().then(function(){closePanels();});
}

function closePanels(){
  document.getElementById('ev-panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

// ══════════════════════════════════════════════════════════════
// MODALS
// ══════════════════════════════════════════════════════════════
function updateBudgetTotal(){
  var total=['bgt-inscription','bgt-transport','bgt-hebergement','bgt-autre'].reduce(function(a,id){
    var el=document.getElementById(id);return a+(el?parseFloat(el.value)||0:0);
  },0);
  document.getElementById('bgt-total').innerText=fmtM(total);
}

function openPropModal(){document.getElementById('modal-prop').classList.add('open');}
function closePropModal(){document.getElementById('modal-prop').classList.remove('open');}
function submitProp(){
  var title=document.getElementById('np-title').value.trim();
  var desc=document.getElementById('np-desc').value.trim();
  if(!title||!desc){alert('Titre et description obligatoires.');return;}
  db.collection('propositions_evenements').add({
    title:title,
    type:document.getElementById('np-type').value,
    date_souhaitee:document.getElementById('np-date').value||null,
    lieu:document.getElementById('np-lieu').value.trim(),
    description:desc,
    argumentaire:document.getElementById('np-argu').value.trim(),
    budget_inscription:parseFloat(document.getElementById('bgt-inscription').value)||0,
    budget_transport:parseFloat(document.getElementById('bgt-transport').value)||0,
    budget_hebergement:parseFloat(document.getElementById('bgt-hebergement').value)||0,
    budget_autre:parseFloat(document.getElementById('bgt-autre').value)||0,
    nb_participants:parseInt(document.getElementById('np-nb').value)||0,
    propose_par:MY_NAME||ME,
    propose_par_email:ME,
    statut:'en_attente',
    created_at:firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    closePropModal();
    alert('✅ Proposition soumise au CA. Merci !');
    switchTab('propositions');
  });
}

function openAddEv(){document.getElementById('modal-add-ev').classList.add('open');}
function closeAddEv(){document.getElementById('modal-add-ev').classList.remove('open');}
function confirmAddEv(){
  var title=document.getElementById('ne-title').value.trim();
  var date=document.getElementById('ne-date').value;
  if(!title||!date){alert('Titre et date obligatoires.');return;}
  db.collection('evenements').add({
    title:title,
    type:document.getElementById('ne-type').value,
    date:date,
    heure:document.getElementById('ne-heure').value||'',
    heure_fin:document.getElementById('ne-heure-fin').value||'',
    lieu:document.getElementById('ne-lieu').value.trim(),
    description:document.getElementById('ne-desc').value.trim(),
    budget:parseFloat(document.getElementById('ne-budget').value)||0,
    visibilite:document.getElementById('ne-visib').value,
    created_by:ME,
    created_at:firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){closeAddEv();});
}

function escHtml(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
</script>
