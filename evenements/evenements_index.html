<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Événements — My-ICN-JC</title>
<link rel="stylesheet" href="../assets/css/global.css"/>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="../assets/js/firebase.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/sidebar.js"></script>
<style>
.ev-tabs{display:flex;gap:3px;background:var(--bg);border-radius:var(--radius-lg);padding:4px;border:1px solid var(--border);width:fit-content;margin-bottom:24px;flex-wrap:wrap;}
.ev-tab{padding:8px 18px;border-radius:var(--radius-md);font-size:13px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--text-secondary);font-family:'Sora',sans-serif;transition:all .2s;}
.ev-tab.active{background:var(--white);color:var(--bordeaux);box-shadow:var(--shadow-sm);font-weight:600;}
.ev-pane{display:none;}.ev-pane.active{display:block;}
.cal-hdr{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.cal-nav{width:32px;height:32px;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--white);cursor:pointer;font-size:16px;color:var(--text-secondary);display:flex;align-items:center;justify-content:center;transition:all .15s;}
.cal-nav:hover{border-color:var(--bordeaux);color:var(--bordeaux);}
.cal-month{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--navy);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cal-day-hdr{text-align:center;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-tertiary);padding:8px 4px;}
.cal-cell{min-height:80px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);padding:6px;cursor:pointer;transition:border-color .15s;}
.cal-cell:hover{border-color:var(--bordeaux);}
.cal-cell.today{border-color:var(--bordeaux);background:rgba(163,33,95,0.04);}
.cal-cell.other-month{opacity:.3;}
.cal-num{font-size:12px;font-weight:600;color:var(--navy);width:22px;height:22px;display:flex;align-items:center;justify-content:center;}
.cal-cell.today .cal-num{background:var(--bordeaux);color:white;border-radius:50%;}
.cal-dot{border-radius:3px;padding:1px 5px;font-size:9px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.cd-interne{background:rgba(27,42,74,0.1);color:var(--navy);}
.cd-externe{background:rgba(163,33,95,0.1);color:var(--bordeaux);}
.ev-panel{position:fixed;right:0;top:0;bottom:0;width:500px;max-width:96vw;background:var(--white);box-shadow:-8px 0 40px rgba(27,42,74,0.18);z-index:400;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease;}
.ev-panel.open{transform:translateX(0);}
.evp-hdr{padding:20px 22px;border-bottom:1px solid var(--border);position:relative;}
.evp-close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-tertiary);}
.evp-body{flex:1;overflow-y:auto;padding:20px 22px;}
.overlay{position:fixed;inset:0;background:rgba(15,25,35,.35);z-index:399;display:none;}
.overlay.open{display:block;}
.ev-card{background:var(--bg-card);border-radius:var(--radius-lg);padding:16px 18px;border:1px solid var(--border);box-shadow:var(--shadow-sm);display:flex;gap:14px;cursor:pointer;transition:all .15s;margin-bottom:12px;}
.ev-card:hover{box-shadow:var(--shadow-md);border-color:var(--bordeaux);}
.ev-card.interne{border-left:3px solid var(--navy);}
.ev-card.externe{border-left:3px solid var(--bordeaux);}
.ev-date-blk{background:var(--bg);border-radius:var(--radius-md);padding:8px 12px;text-align:center;min-width:50px;flex-shrink:0;}
.ev-date-day{font-size:20px;font-weight:800;color:var(--navy);line-height:1;}
.ev-date-mo{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-tertiary);}
.prop-card{background:var(--bg-card);border-radius:var(--radius-lg);padding:16px 18px;border:1px solid var(--border);margin-bottom:12px;}
.prop-card.en_attente{border-left:3px solid #f59e0b;}
.prop-card.approuve{border-left:3px solid var(--success);}
.prop-card.refuse{border-left:3px solid var(--danger);opacity:.7;}
.prop-card.en_discussion{border-left:3px solid #3b82f6;}
.ps{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;}
.ps-att{background:#fef3c7;color:#78350f;}.ps-app{background:#dcfce7;color:#14532d;}
.ps-ref{background:#fee2e2;color:#991b1b;}.ps-dis{background:#dbeafe;color:#1e3a5f;}
.bgt-row{display:flex;gap:8px;align-items:center;margin-bottom:6px;}
.bgt-row input{flex:1;padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:'Sora',sans-serif;font-size:12px;}
.bgt-row input:focus{outline:none;border-color:var(--bordeaux);}
.bgt-del{background:none;border:none;color:var(--danger);cursor:pointer;font-size:16px;padding:0 4px;line-height:1;}
.type-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;}
.tb-int{background:rgba(27,42,74,0.1);color:var(--navy);}
.tb-ext{background:rgba(163,33,95,0.1);color:var(--bordeaux);}
.fld{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);}
.fld-l{font-size:12px;color:var(--text-tertiary);width:110px;flex-shrink:0;}
.fld-v{font-size:13px;color:var(--text-primary);}
</style>
</head>
<body>
<div class="login-page" id="login-page">
  <div class="login-box">
    <div class="login-logo"><img src="../assets/images/ICN-Junior-Conseil_logo.png" style="height:54px;object-fit:contain"/></div>
    <div class="login-title">Connexion</div>
    <div class="login-sub">Accès réservé aux membres ICN Junior Conseil.</div>
    <button class="google-btn" onclick="doGoogleLogin()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google"/>Se connecter avec Google
    </button>
    <div class="denied-box" id="denied-box"><strong>Accès refusé</strong><p id="denied-msg"></p></div>
    <div class="login-error" id="login-error"></div>
  </div>
</div>
<div class="app-page" id="app-page">
  <div id="sidebar-container"></div>
  <div class="app-content">
    <div class="page-header">
      <div class="flex justify-between items-center" style="flex-wrap:wrap;gap:10px">
        <div><div class="page-title">Événements</div><div class="page-subtitle" id="page-sub"></div></div>
        <div class="flex gap-2">
          <button class="btn btn-secondary btn-sm" onclick="openProp()">Proposer un événement</button>
          <button class="btn btn-primary btn-sm" id="btn-add" onclick="openAdd()" style="display:none">+ Créer</button>
        </div>
      </div>
    </div>
    <div class="page-body">
      <div class="ev-tabs">
        <button class="ev-tab active" onclick="switchTab('cal')" id="evt-cal">Calendrier</button>
        <button class="ev-tab" onclick="switchTab('list')" id="evt-list">Liste</button>
        <button class="ev-tab" onclick="switchTab('prop')" id="evt-prop">Propositions <span id="prop-badge" style="display:none;background:var(--bordeaux);color:white;border-radius:99px;padding:1px 6px;font-size:10px;margin-left:4px"></span></button>
      </div>
      <div class="ev-pane active" id="evp-cal">
        <div class="cal-hdr">
          <button class="cal-nav" onclick="prevM()">&#8249;</button>
          <div class="cal-month" id="cal-title"></div>
          <button class="cal-nav" onclick="nextM()">&#8250;</button>
          <button class="btn btn-secondary btn-sm" onclick="goToday()">Aujourd'hui</button>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>
      <div class="ev-pane" id="evp-list">
        <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
          <select id="lf-type" onchange="renderList()" style="padding:6px 10px;border-radius:var(--radius-md);border:1.5px solid var(--border-strong);font-family:'Sora',sans-serif;font-size:12px">
            <option value="">Tous types</option><option value="interne">Interne</option><option value="externe">Externe</option>
          </select>
          <select id="lf-period" onchange="renderList()" style="padding:6px 10px;border-radius:var(--radius-md);border:1.5px solid var(--border-strong);font-family:'Sora',sans-serif;font-size:12px">
            <option value="upcoming">A venir</option><option value="past">Passes</option><option value="all">Tous</option>
          </select>
          <input type="text" id="lf-srch" oninput="renderList()" placeholder="Rechercher..." style="padding:6px 10px;border-radius:var(--radius-md);border:1.5px solid var(--border-strong);font-family:'Sora',sans-serif;font-size:12px;min-width:160px"/>
        </div>
        <div id="ev-list"></div>
      </div>
      <div class="ev-pane" id="evp-prop">
        <div id="prop-list"></div>
      </div>
    </div>
  </div>
</div>
<div class="overlay" id="overlay" onclick="closePanel()"></div>
<div class="ev-panel" id="ev-panel">
  <div class="evp-hdr">
    <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-tertiary);margin-bottom:3px" id="evp-type"></div>
    <div style="font-family:'Playfair Display',serif;font-size:18px;color:var(--navy)" id="evp-title"></div>
    <div style="font-size:12px;color:var(--text-tertiary);margin-top:4px" id="evp-date"></div>
    <button class="evp-close" onclick="closePanel()">x</button>
  </div>
  <div class="evp-body" id="evp-body"></div>
</div>
<!-- MODAL PROPOSITION -->
<div class="modal-overlay" id="modal-prop" onclick="if(event.target===this)closeProp()">
  <div class="modal-box" style="max-width:580px">
    <div class="modal-header"><div class="modal-title">Proposer un evenement</div><button class="modal-close" onclick="closeProp()">x</button></div>
    <div class="form-grid">
      <div class="form-field full"><label class="input-label">Titre *</label><input class="input" id="np-title"/></div>
      <div class="form-field"><label class="input-label">Type</label>
        <select class="select-field" id="np-type"><option value="externe">Externe</option><option value="interne">Interne</option></select></div>
      <div class="form-field"><label class="input-label">Date envisagee</label><input class="input" type="date" id="np-date"/></div>
      <div class="form-field full"><label class="input-label">Lieu</label><input class="input" id="np-lieu"/></div>
      <div class="form-field full"><label class="input-label">Description *</label><textarea class="input" id="np-desc" rows="3" style="resize:vertical"></textarea></div>
      <div class="form-field full"><label class="input-label">Argumentaire</label><textarea class="input" id="np-argu" rows="2" style="resize:vertical"></textarea></div>
      <div class="form-field full">
        <label class="input-label">Budget previsionnel <span style="font-size:10px;color:var(--text-tertiary);font-weight:400">— ajoute autant de postes que necessaire</span></label>
        <div id="bgt-rows"></div>
        <button type="button" class="btn btn-secondary btn-sm" style="margin-top:6px" onclick="addBgtRow()">+ Ajouter un poste</button>
        <div style="font-size:13px;font-weight:700;color:var(--navy);margin-top:10px;padding:8px 10px;background:var(--bg);border-radius:var(--radius-md)">Total estime : <span id="bgt-total">0 €</span></div>
      </div>
      <div class="form-field"><label class="input-label">Nb participants</label><input class="input" type="number" id="np-nb" placeholder="0"/></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeProp()">Annuler</button>
      <button class="btn btn-primary" onclick="submitProp()">Soumettre</button>
    </div>
  </div>
</div>
<!-- MODAL CREER -->
<div class="modal-overlay" id="modal-add" onclick="if(event.target===this)closeAdd()">
  <div class="modal-box" style="max-width:560px">
    <div class="modal-header"><div class="modal-title">Creer un evenement</div><button class="modal-close" onclick="closeAdd()">x</button></div>
    <div class="form-grid">
      <div class="form-field full"><label class="input-label">Titre *</label><input class="input" id="ne-title"/></div>
      <div class="form-field"><label class="input-label">Type</label>
        <select class="select-field" id="ne-type"><option value="interne">Interne</option><option value="externe">Externe</option></select></div>
      <div class="form-field"><label class="input-label">Date *</label><input class="input" type="date" id="ne-date"/></div>
      <div class="form-field"><label class="input-label">Heure debut</label><input class="input" type="time" id="ne-h1"/></div>
      <div class="form-field"><label class="input-label">Heure fin</label><input class="input" type="time" id="ne-h2"/></div>
      <div class="form-field"><label class="input-label">Lieu</label><input class="input" id="ne-lieu"/></div>
      <div class="form-field full"><label class="input-label">Description</label><textarea class="input" id="ne-desc" rows="2" style="resize:vertical"></textarea></div>
      <div class="form-field"><label class="input-label">Budget total (€)</label><input class="input" type="number" id="ne-budget" placeholder="0"/></div>
      <div class="form-field"><label class="input-label">Visibilite</label>
        <select class="select-field" id="ne-visib"><option value="tous">Tous les membres</option><option value="ca">CA uniquement</option></select></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeAdd()">Annuler</button>
      <button class="btn btn-primary" onclick="confirmAdd()">Creer</button>
    </div>
  </div>
</div>
<script>
var ME='',MY_ROLE='',MY_NAME='',IS_CA=false;
var allEvents=[],allProps=[],calY,calM,today=new Date(),curEvId=null;
var EV_CA_ROLES=['super_admin','president','vice_president','tresorier','secretaire','responsable_commercial','responsable_qualite','responsable_marketing','tresorerie','auditeur','marketing'];
var MOIS=['Janvier','Fevrier','Mars','Avril','Mai','Juin','Juillet','Aout','Septembre','Octobre','Novembre','Decembre'];
var MOIS_S=['jan','fev','mar','avr','mai','jun','jul','aou','sep','oct','nov','dec'];
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtD(s){if(!s)return'--';var p=s.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s;}
function fmtM(n){return Number(n||0).toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:0})+' EUR';}
function todayStr(){return today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');}

initAuth('evenements',function(user,role,profile){
  ME=user.email;MY_ROLE=role;MY_NAME=((profile.prenom||'')+' '+(profile.nom||'')).trim();
  IS_CA=EV_CA_ROLES.includes(role);
  renderSidebar(role,profile,user,'evenements');
  showAppPage(user,role,profile);
  updateHealthIndicator();
  if(IS_CA)document.getElementById('btn-add').style.display='flex';
  calY=today.getFullYear();calM=today.getMonth();
  var M=['janvier','fevrier','mars','avril','mai','juin','juillet','aout','septembre','octobre','novembre','decembre'];
  document.getElementById('page-sub').innerText=today.getDate()+' '+M[today.getMonth()]+' '+today.getFullYear();
  addBgtRow();
  loadData();
});

function loadData(){
  db.collection('evenements').orderBy('date').onSnapshot(function(snap){
    allEvents=[];
    snap.forEach(function(doc){
      var d=Object.assign({id:doc.id},doc.data());
      if(d.visibilite==='ca'&&!IS_CA)return;
      allEvents.push(d);
    });
    renderCal();
    renderList();
  });
  db.collection('propositions_evenements').orderBy('created_at','desc').onSnapshot(function(snap){
    allProps=[];
    snap.forEach(function(doc){allProps.push(Object.assign({id:doc.id},doc.data()));});
    renderProps();
    var n=allProps.filter(function(p){return p.statut==='en_attente';}).length;
    var b=document.getElementById('prop-badge');
    if(n>0){b.style.display='';b.innerText=n;}else{b.style.display='none';}
  });
}

function switchTab(k){
  ['cal','list','prop'].forEach(function(t){
    document.getElementById('evt-'+t).classList.toggle('active',t===k);
    document.getElementById('evp-'+t).classList.toggle('active',t===k);
  });
}

function renderCal(){
  document.getElementById('cal-title').innerText=MOIS[calM]+' '+calY;
  var first=new Date(calY,calM,1),last=new Date(calY,calM+1,0);
  var startDow=(first.getDay()+6)%7;
  var DAYS=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
  var html=DAYS.map(function(d){return'<div class="cal-day-hdr">'+d+'</div>';}).join('');
  for(var i=0;i<startDow;i++){var d2=new Date(calY,calM,1-startDow+i);html+='<div class="cal-cell other-month"><div class="cal-num">'+d2.getDate()+'</div></div>';}
  for(var day=1;day<=last.getDate();day++){
    var ds=calY+'-'+String(calM+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    var isT=calY===today.getFullYear()&&calM===today.getMonth()&&day===today.getDate();
    var dayEvs=allEvents.filter(function(e){return e.date===ds;});
    var dots=dayEvs.slice(0,3).map(function(e){
      return'<div class="cal-dot '+(e.type==='externe'?'cd-externe':'cd-interne')+'" onclick="event.stopPropagation();openEv(\''+e.id+'\')" title="'+esc(e.title)+'">'+esc(e.title)+'</div>';
    }).join('');
    html+='<div class="cal-cell'+(isT?' today':'')+(dayEvs.length?' has-event':'')+'" onclick="openDayPanel(\''+ds+'\')">' +
      '<div class="cal-num">'+day+'</div>'+dots+'</div>';
  }
  var endDow=(last.getDay()+6)%7;
  for(var j=1;j<=(endDow===6?0:6-endDow);j++){html+='<div class="cal-cell other-month"><div class="cal-num">'+j+'</div></div>';}
  document.getElementById('cal-grid').innerHTML=html;
}
function prevM(){calM--;if(calM<0){calM=11;calY--;}renderCal();}
function nextM(){calM++;if(calM>11){calM=0;calY++;}renderCal();}
function goToday(){calY=today.getFullYear();calM=today.getMonth();renderCal();}

function openDayPanel(ds){
  var dayEvs=allEvents.filter(function(e){return e.date===ds;});
  document.getElementById('evp-type').innerText='Evenements du '+fmtD(ds);
  document.getElementById('evp-title').innerText=dayEvs.length+' evenement'+(dayEvs.length!==1?'s':'');
  document.getElementById('evp-date').innerText='';
  if(!dayEvs.length){
    document.getElementById('evp-body').innerHTML='<div style="color:var(--text-tertiary);font-size:13px;padding:10px 0">Aucun evenement ce jour.</div>'+
      (IS_CA?'<button class="btn btn-primary btn-sm" style="margin-top:10px" onclick="closePanel();openAddWithDate(\''+ds+'\')">+ Creer un evenement ce jour</button>':'');
  }else{
    document.getElementById('evp-body').innerHTML=dayEvs.map(function(e){
      return'<div style="background:var(--bg);border-radius:var(--radius-lg);padding:14px;margin-bottom:10px;cursor:pointer;border:1px solid var(--border)" onclick="closePanel();setTimeout(function(){openEv(\''+e.id+'\')},250)">'+
        '<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">'+
          '<span class="type-badge '+(e.type==='externe'?'tb-ext':'tb-int')+'">'+(e.type==='externe'?'Externe':'Interne')+'</span>'+
          (e.heure?'<span style="font-size:11px;color:var(--text-tertiary)">'+e.heure+(e.heure_fin?' - '+e.heure_fin:'')+'</span>':'')+
        '</div>'+
        '<div style="font-weight:600;font-size:14px;color:var(--navy)">'+esc(e.title)+'</div>'+
        (e.lieu?'<div style="font-size:11px;color:var(--text-tertiary);margin-top:3px">'+esc(e.lieu)+'</div>':'')+
      '</div>';
    }).join('');
  }
  openPanel();
}

function renderList(){
  var ft=document.getElementById('lf-type').value;
  var fp=document.getElementById('lf-period').value;
  var fs=(document.getElementById('lf-srch').value||'').toLowerCase();
  var tds=todayStr();
  var data=allEvents.filter(function(e){
    if(ft&&e.type!==ft)return false;
    if(fp==='upcoming'&&e.date<tds)return false;
    if(fp==='past'&&e.date>=tds)return false;
    if(fs&&!(e.title||'').toLowerCase().includes(fs)&&!(e.lieu||'').toLowerCase().includes(fs))return false;
    return true;
  });
  data.sort(function(a,b){return fp==='past'?(b.date||'').localeCompare(a.date||''):(a.date||'').localeCompare(b.date||'');});
  if(!data.length){document.getElementById('ev-list').innerHTML='<div style="text-align:center;padding:40px;color:var(--text-tertiary)">Aucun evenement</div>';return;}
  var MS=['jan','fev','mar','avr','mai','jun','jul','aou','sep','oct','nov','dec'];
  document.getElementById('ev-list').innerHTML=data.map(function(e){
    var p=e.date?e.date.split('-'):null;
    var day=p?p[2]:'--';var mo=p?MS[parseInt(p[1])-1]:'';
    return'<div class="ev-card '+(e.type||'interne')+'" onclick="openEv(\''+e.id+'\')">' +
      '<div class="ev-date-blk"><div class="ev-date-day">'+day+'</div><div class="ev-date-mo">'+mo+'</div></div>'+
      '<div style="flex:1;min-width:0">'+
        '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'+
          '<div style="font-weight:700;font-size:14px;color:var(--navy)">'+esc(e.title||'')+'</div>'+
          '<span class="type-badge '+(e.type==='externe'?'tb-ext':'tb-int')+'">'+(e.type==='externe'?'Externe':'Interne')+'</span>'+
        '</div>'+
        '<div style="font-size:12px;color:var(--text-tertiary);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap">'+
          (e.lieu?'<span>'+esc(e.lieu)+'</span>':'')+
          (e.heure?'<span>'+e.heure+(e.heure_fin?' - '+e.heure_fin:'')+'</span>':'')+
          (e.budget?'<span>'+fmtM(e.budget)+'</span>':'')+
        '</div>'+
        (e.description?'<div style="font-size:12px;color:var(--text-secondary);margin-top:5px">'+esc(e.description.slice(0,100))+(e.description.length>100?'...':'')+'</div>':'')+
      '</div>'+
    '</div>';
  }).join('');
}

function renderProps(){
  var canD=['super_admin','president','vice_president'].includes(MY_ROLE);
  if(!allProps.length){
    document.getElementById('prop-list').innerHTML='<div style="text-align:center;padding:40px;color:var(--text-tertiary)">Aucune proposition</div>';
    return;
  }
  var SC={en_attente:'ps-att',approuve:'ps-app',refuse:'ps-ref',en_discussion:'ps-dis'};
  var ST={en_attente:'En attente',approuve:'Approuve',refuse:'Refuse',en_discussion:'En discussion'};
  document.getElementById('prop-list').innerHTML=allProps.map(function(p){
    var sc=SC[p.statut]||'ps-att';var st=ST[p.statut]||'En attente';
    var bgtItems=p.budget_items||[];
    var bgtTotal=bgtItems.reduce(function(a,b){return a+(parseFloat(b.montant)||0);},0);
    var acts='';
    if(canD&&p.statut==='en_attente'){
      acts='<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">'+
        '<button class="btn btn-secondary btn-sm" onclick="decide(\''+p.id+'\',\'en_discussion\')">En discussion</button>'+
        '<button class="btn btn-secondary btn-sm" style="background:#dcfce7;color:#14532d;border-color:#86efac" onclick="decide(\''+p.id+'\',\'approuve\')">Approuver</button>'+
        '<button class="btn btn-secondary btn-sm" style="background:#fee2e2;color:#991b1b;border-color:#fca5a5" onclick="decide(\''+p.id+'\',\'refuse\')">Refuser</button>'+
      '</div>';
    }
    if(canD&&p.statut==='approuve'){
      acts='<div style="margin-top:10px"><button class="btn btn-primary btn-sm" onclick="createFromProp(\''+p.id+'\')">Creer l\'evenement</button></div>';
    }
    return'<div class="prop-card '+(p.statut||'en_attente')+'">'+
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:10px">'+
        '<div><div style="font-weight:700;font-size:14px;color:var(--navy)">'+esc(p.title||'')+'</div>'+
        '<div style="font-size:11px;color:var(--text-tertiary);margin-top:2px">Par '+esc(p.propose_par||'')+
          (p.date_souhaitee?' - '+fmtD(p.date_souhaitee):'')+
          (p.lieu?' - '+esc(p.lieu):'')+
        '</div></div>'+
        '<span class="ps '+sc+'">'+st+'</span>'+
      '</div>'+
      (p.description?'<div style="font-size:13px;color:var(--text-secondary);line-height:1.5;margin-bottom:8px">'+esc(p.description)+'</div>':'')+
      (p.argumentaire?'<div style="background:var(--bg);border-radius:var(--radius-sm);padding:8px 10px;font-size:12px;margin-bottom:8px"><b>Argumentaire :</b> '+esc(p.argumentaire)+'</div>':'')+
      (bgtTotal>0?'<div style="font-size:12px;margin-bottom:8px"><b>Budget :</b> '+fmtM(bgtTotal)+' - '+bgtItems.map(function(b){return esc(b.label)+' : '+fmtM(b.montant);}).join(' - ')+'</div>':'')+
      acts+
      (canD&&p.statut!=='refuse'?'<div style="margin-top:10px"><input class="input" id="note-'+p.id+'" value="'+esc(p.note_decision||'')+'" placeholder="Note de decision..." style="font-size:12px"/><button class="btn btn-secondary btn-sm" style="margin-top:6px" onclick="saveNote(\''+p.id+'\')">Enregistrer</button></div>':'')+
    '</div>';
  }).join('');
}

function decide(id,statut){db.collection('propositions_evenements').doc(id).update({statut:statut,decide_par:ME,decide_le:todayStr()});}
function saveNote(id){var el=document.getElementById('note-'+id);if(!el||!el.value.trim())return;db.collection('propositions_evenements').doc(id).update({note_decision:el.value.trim()});}
function createFromProp(pid){
  var p=allProps.find(function(x){return x.id===pid;});if(!p)return;
  var bgtTotal=(p.budget_items||[]).reduce(function(a,b){return a+(parseFloat(b.montant)||0);},0);
  db.collection('evenements').add({
    title:p.title,type:p.type||'externe',date:p.date_souhaitee||'',
    lieu:p.lieu||'',description:p.description||'',budget:bgtTotal,
    heure:'',heure_fin:'',visibilite:'tous',created_by:ME,from_proposition:pid,
    created_at:firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    db.collection('propositions_evenements').doc(pid).update({statut:'approuve',evenement_cree:true});
  });
}

function openEv(id){
  var e=allEvents.find(function(x){return x.id===id;});if(!e)return;
  curEvId=id;
  document.getElementById('evp-type').innerText=e.type==='externe'?'Evenement externe':'Evenement interne';
  document.getElementById('evp-title').innerText=e.title||'';
  document.getElementById('evp-date').innerText=fmtD(e.date)+(e.heure?' - '+e.heure+(e.heure_fin?' - '+e.heure_fin:''):'')+(e.lieu?' - '+e.lieu:'');
  document.getElementById('evp-body').innerHTML=
    (e.description?'<p style="font-size:14px;color:var(--text-secondary);line-height:1.7;margin-bottom:16px">'+esc(e.description)+'</p>':'')+
    fld('Type',e.type==='externe'?'Externe':'Interne')+
    fld('Date',fmtD(e.date))+
    fld('Horaire',(e.heure||'Non defini')+(e.heure_fin?' - '+e.heure_fin:''))+
    fld('Lieu',e.lieu||'--')+
    fld('Budget',e.budget?fmtM(e.budget):'--')+
    fld('Visibilite',e.visibilite==='ca'?'CA uniquement':'Tous les membres')+
    (IS_CA?
      '<div style="margin-top:16px;display:flex;flex-direction:column;gap:8px">'+
        '<div><label class="input-label">Titre</label><input class="input" value="'+esc(e.title||'')+'" style="font-size:12px" onblur="updEv(\''+id+'\',\'title\',this.value)"/></div>'+
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+
          '<div><label class="input-label">Date</label><input class="input" type="date" value="'+(e.date||'')+'" style="font-size:12px" onchange="updEv(\''+id+'\',\'date\',this.value)"/></div>'+
          '<div><label class="input-label">Lieu</label><input class="input" value="'+esc(e.lieu||'')+'" style="font-size:12px" onblur="updEv(\''+id+'\',\'lieu\',this.value)"/></div>'+
          '<div><label class="input-label">Heure debut</label><input class="input" type="time" value="'+(e.heure||'')+'" style="font-size:12px" onchange="updEv(\''+id+'\',\'heure\',this.value)"/></div>'+
          '<div><label class="input-label">Heure fin</label><input class="input" type="time" value="'+(e.heure_fin||'')+'" style="font-size:12px" onchange="updEv(\''+id+'\',\'heure_fin\',this.value)"/></div>'+
        '</div>'+
        '<div><label class="input-label">Description</label><textarea class="input" rows="2" style="font-size:12px;resize:vertical" onblur="updEv(\''+id+'\',\'description\',this.value)">'+esc(e.description||'')+'</textarea></div>'+
        '<button style="background:#fee2e2;color:#991b1b;border-color:#fca5a5" class="btn btn-secondary btn-sm" onclick="deleteEv(\''+id+'\')">Supprimer</button>'+
      '</div>'
    :'');
  openPanel();
}

function fld(l,v){return'<div class="fld"><div class="fld-l">'+l+'</div><div class="fld-v">'+v+'</div></div>';}
function updEv(id,f,v){var u={};u[f]=v;db.collection('evenements').doc(id).update(u);}
function deleteEv(id){if(!confirm('Supprimer ?'))return;db.collection('evenements').doc(id).delete().then(function(){closePanel();});}
function openPanel(){document.getElementById('ev-panel').classList.add('open');document.getElementById('overlay').classList.add('open');}
function closePanel(){document.getElementById('ev-panel').classList.remove('open');document.getElementById('overlay').classList.remove('open');curEvId=null;}

function addBgtRow(){
  var row=document.createElement('div');row.className='bgt-row';
  row.innerHTML='<input placeholder="Poste (ex: Location salle)"/><input type="number" placeholder="Montant (€)" oninput="updateBgtTotal()" style="max-width:130px"/><button class="bgt-del" onclick="this.parentNode.remove();updateBgtTotal()">x</button>';
  document.getElementById('bgt-rows').appendChild(row);
}
function updateBgtTotal(){
  var total=0;
  document.querySelectorAll('#bgt-rows .bgt-row').forEach(function(r){
    var inputs=r.querySelectorAll('input');total+=parseFloat((inputs[1]||{}).value)||0;
  });
  document.getElementById('bgt-total').innerText=fmtM(total);
}
function getBgtItems(){
  var items=[];
  document.querySelectorAll('#bgt-rows .bgt-row').forEach(function(r){
    var inputs=r.querySelectorAll('input');
    var label=(inputs[0]||{}).value||'';var montant=parseFloat((inputs[1]||{}).value)||0;
    if(label||montant)items.push({label:label,montant:montant});
  });
  return items;
}

function openProp(){document.getElementById('modal-prop').classList.add('open');}
function closeProp(){document.getElementById('modal-prop').classList.remove('open');}
function submitProp(){
  var title=document.getElementById('np-title').value.trim();
  var desc=document.getElementById('np-desc').value.trim();
  if(!title||!desc){alert('Titre et description obligatoires.');return;}
  db.collection('propositions_evenements').add({
    title:title,type:document.getElementById('np-type').value,
    date_souhaitee:document.getElementById('np-date').value||null,
    lieu:document.getElementById('np-lieu').value.trim(),
    description:desc,argumentaire:document.getElementById('np-argu').value.trim(),
    budget_items:getBgtItems(),nb_participants:parseInt(document.getElementById('np-nb').value)||0,
    propose_par:MY_NAME||ME,propose_par_email:ME,statut:'en_attente',
    created_at:firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){closeProp();switchTab('prop');});
}

function openAdd(){document.getElementById('ne-title').value='';document.getElementById('ne-date').value='';document.getElementById('modal-add').classList.add('open');}
function openAddWithDate(ds){document.getElementById('ne-date').value=ds;document.getElementById('ne-title').value='';document.getElementById('modal-add').classList.add('open');}
function closeAdd(){document.getElementById('modal-add').classList.remove('open');}
function confirmAdd(){
  var title=document.getElementById('ne-title').value.trim();
  var date=document.getElementById('ne-date').value;
  if(!title||!date){alert('Titre et date obligatoires.');return;}
  db.collection('evenements').add({
    title:title,type:document.getElementById('ne-type').value,date:date,
    heure:document.getElementById('ne-h1').value||'',
    heure_fin:document.getElementById('ne-h2').value||'',
    lieu:document.getElementById('ne-lieu').value.trim(),
    description:document.getElementById('ne-desc').value.trim(),
    budget:parseFloat(document.getElementById('ne-budget').value)||0,
    visibilite:document.getElementById('ne-visib').value,
    created_by:ME,created_at:firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){closeAdd();});
}
</script>
