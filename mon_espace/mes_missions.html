.mc{background:var(--bg-card);border-radius:var(--radius-lg);border:1px solid var(--border);box-shadow:var(--shadow-sm);overflow:hidden;margin-bottom:16px;}

.mc-top{padding:18px 20px;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;}
.mc-date-box{background:var(--bg);border-radius:var(--radius-md);padding:10px 14px;text-align:center;min-width:56px;flex-shrink:0;}

.mc-info{flex:1;min-width:0;}
.mc-ref{font-family:monospace;font-size:11px;font-weight:700;color:var(--bordeaux);}

.mc-type-badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:99px;margin-top:6px;display:inline-block;}
.type-marche{background:#e0f2fe;color:#0c4a6e;}.type-marketing{background:#fce7f3;color:#831843;}
.type-finance{background:#dcfce7;color:#14532d;}.type-affaires{background:#fef3c7;color:#78350f;}
.mc-stats{display:flex;gap:12px;padding:12px 20px;border-top:1px solid var(--border);background:#fafafa;flex-wrap:wrap;}
.mc-stat-val{font-size:15px;font-weight:700;color:var(--navy);}
.mc-stat-lbl{font-size:10px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.06em;}
.phase-track{padding:16px 20px;border-top:1px solid var(--border);}
.phase-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-tertiary);margin-bottom:10px;}
.phases-bar{display:flex;gap:2px;margin-bottom:14px;height:6px;}

.phase-seg.done{background:var(--bordeaux);}.phase-seg.current{background:#f9a8d4;}
.phase-item{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--border);}
.phase-item:last-child{border-bottom:none;}
.phase-check{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .2s;font-size:12px;}
.phase-check.done{background:var(--bordeaux);border-color:var(--bordeaux);color:white;}
.phase-check.current{border-color:var(--bordeaux);}
.phase-name{font-size:13px;font-weight:600;color:var(--navy);}
.phase-sub{font-size:11px;color:var(--text-tertiary);margin-top:1px;}
.phase-expand{font-size:11px;color:var(--bordeaux);cursor:pointer;margin-top:3px;}
.phase-extra{display:none;margin-top:8px;}

.phase-note{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:Sora,sans-serif;font-size:12px;resize:vertical;min-height:48px;}

<script>
var STUDY_TYPES = {

    subtypes:['Étude de marché','Étude de lancement','Benchmark','Veille stratégique'],
    phases:[
      {id:'cadrage',label:'Cadrage',sub:'Objectifs, problématique, périmètre'},
      {id:'conception',label:'Conception',sub:'Méthodologie, questionnaires, guides'},
      {id:'collecte',label:'Collecte',sub:'Enquêtes terrain, interviews, recherche doc'},
      {id:'analyse',label:'Analyse',sub:'Traitement données, segmentation, insights'},
      {id:'recommandations',label:'Recommandations',sub:'Opportunités, positionnement, axes de dev'},
      {id:'restitution',label:'Restitution',sub:'Rapport détaillé, présentation client'}
    ]},
  marketing:{label:'Marketing & Communication',badge:'type-marketing',icon:'📣',
    subtypes:['Étude de notoriété','Plan de communication','Étude de satisfaction'],
    phases:[
      {id:'cadrage',label:'Cadrage',sub:'KPIs, identification des cibles'},
      {id:'conception',label:'Conception',sub:'Questionnaires, sondages, choix canaux'},
      {id:'collecte',label:'Collecte',sub:'Diffusion enquêtes, feedback clients'},
      {id:'analyse',label:'Analyse',sub:'Indicateurs, analyse qualitative des retours'},
      {id:'recommandations',label:'Recommandations',sub:'Actions marketing, stratégie com'},
      {id:'restitution',label:'Restitution',sub:'Synthèse opérationnelle, plan d\'actions'}
    ]},
  finance:{label:'Finance & Audit',badge:'type-finance',icon:'💰',
    subtypes:['Business plan','Diagnostic RSE','Visite mystère'],
    phases:[
      {id:'cadrage',label:'Cadrage',sub:'Analyse des besoins'},
      {id:'collecte',label:'Collecte',sub:'Données financières, documents internes'},
      {id:'analyse',label:'Analyse',sub:'Diagnostic, calculs de rentabilité'},
      {id:'construction',label:'Construction',sub:'Business plan, scénarios financiers'},
      {id:'recommandations',label:'Recommandations',sub:'Décisions investissement, optimisation'},
      {id:'restitution',label:'Restitution',sub:'Livrables structurés, projections'}
    ]},
  affaires:{label:'Affaires Publiques',badge:'type-affaires',icon:'🏛️',
    subtypes:['Sondage d\'opinion'],
    phases:[
      {id:'cadrage',label:'Cadrage',sub:'Public cible, objectif du sondage'},
      {id:'conception',label:'Conception',sub:'Création du questionnaire'},
      {id:'collecte',label:'Collecte',sub:'Diffusion à l\'échantillon'},
      {id:'analyse',label:'Analyse',sub:'Traitement statistique, interprétation'},
      {id:'recommandations',label:'Recommandations',sub:'Aide à la décision'},
      {id:'restitution',label:'Restitution',sub:'Rapport + synthèse décisionnelle'}
    ]}
};

function getTypeKey(t){
  if(!t)return 'marche';
  var tl=t.toLowerCase();
  if(tl.includes('march')||tl.includes('strat')||tl.includes('bench')||tl.includes('veille')||tl.includes('lancement'))return 'marche';
  if(tl.includes('market')||tl.includes('not')||tl.includes('satisf')||tl.includes('com'))return 'marketing';
  if(tl.includes('finan')||tl.includes('audit')||tl.includes('business')||tl.includes('rse')||tl.includes('myst'))return 'finance';
  if(tl.includes('public')||tl.includes('sondage'))return 'affaires';
  return 'marche';
}

var ME='',MY_ROLE='',MY_NAME='',MY_IV_ID=null;
var myMissions=[],myDocs=[],questionnaire=null,questionnaireId=null,curQId=null;
var MOIS_S=['jan','fév','mar','avr','mai','jun','jul','aoû','sep','oct','nov','déc'];
function fmtD(s){if(!s)return'—';var p=s.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s;}
function fmtM(n){return Number(n||0).toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:0})+' €';}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

initAuth('mes_missions',function(user,role,profile){
  ME=user.email;MY_ROLE=role;
  MY_NAME=((profile.prenom||'')+' '+(profile.nom||'')).trim();
  renderSidebar(role,profile,user,'mes_missions');
  showAppPage(user,role,profile);
  updateHealthIndicator();
  var now=new Date();
  var M=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  document.getElementById('page-sub').innerText=(profile.prenom||'')+' · '+now.getDate()+' '+M[now.getMonth()]+' '+now.getFullYear();
  loadData();
});

function loadData(){
  db.collection('questionnaires').where('actif','==',true).limit(1).get().then(function(snap){
    if(!snap.empty){questionnaireId=snap.docs[0].id;questionnaire=Object.assign({id:snap.docs[0].id},snap.docs[0].data());}
  });
  // Find intervenant by email
  db.collection('intervenants').get().then(function(snap){
    snap.forEach(function(doc){
      var d=doc.data();
      if((d.email||'').toLowerCase()===ME.toLowerCase())MY_IV_ID=doc.id;
    });
    // Load études
    db.collection('etudes').onSnapshot(function(snap2){
      myMissions=[];
      snap2.forEach(function(doc){
        var e=Object.assign({id:doc.id},doc.data());
        var isMe=(e.intervenants||[]).some(function(i){
          return i.intervenant_id===MY_IV_ID||(i.email||'').toLowerCase()===ME.toLowerCase();
        });
        if(isMe)myMissions.push(e);
      });
      renderMissions();
    });
    // Load docs
    var q=MY_IV_ID
      ?db.collection('documents').where('intervenant_id','==',MY_IV_ID)
      :db.collection('documents').where('intervenant_email','==',ME);
    q.onSnapshot(function(snap3){
      myDocs=[];
      snap3.forEach(function(doc){myDocs.push(Object.assign({id:doc.id},doc.data()));});
      renderLiens();
    });
  });
}

function switchTab(k){
  ['actives','historique','liens'].forEach(function(t){
    document.getElementById('mmt-'+t).classList.toggle('active',t===k);
    document.getElementById('mmp-'+t).classList.toggle('active',t===k);
  });
}

function renderMissions(){
  var act=myMissions.filter(function(e){return['Signé','En cours'].includes(e.statut);});
  var done=myMissions.filter(function(e){return['Livré','Facturé','Clôturé'].includes(e.statut);});
  renderList(act,'mmp-actives',true);
  renderList(done,'mmp-historique',false);
}

// ── Phases par type d'étude ───────────────────────────────────
var PHASES_DEF = {
  marche: [
    {id:'cadrage',      label:'Cadrage',        sub:'Objectifs, problématique, périmètre'},
    {id:'conception',   label:'Conception',     sub:'Méthodologie, questionnaires, guides entretien'},
    {id:'collecte',     label:'Collecte',       sub:'Enquêtes terrain, interviews, recherche documentaire'},
    {id:'analyse',      label:'Analyse',        sub:'Traitement données, segmentation, insights'},
    {id:'recommandations',label:'Recommandations',sub:'Opportunités, positionnement, axes de développement'},
    {id:'restitution',  label:'Restitution',    sub:'Rapport détaillé, présentation client'}
  ],
  marketing: [
    {id:'cadrage',      label:'Cadrage',        sub:'KPIs, identification des cibles'},
    {id:'conception',   label:'Conception',     sub:'Questionnaires, sondages, choix des canaux'},
    {id:'collecte',     label:'Collecte',       sub:'Diffusion enquêtes, collecte feedback clients'},
    {id:'analyse',      label:'Analyse',        sub:'Indicateurs, analyse qualitative des retours'},
    {id:'recommandations',label:'Recommandations',sub:'Actions marketing, stratégie communication'},
    {id:'restitution',  label:'Restitution',    sub:'Synthèse opérationnelle, plan d\'actions'}
  ],
  finance: [
    {id:'cadrage',      label:'Cadrage',        sub:'Analyse des besoins (financement, performance)'},
    {id:'collecte',     label:'Collecte',       sub:'Données financières, documents internes'},
    {id:'analyse',      label:'Analyse',        sub:'Diagnostic, calculs de rentabilité'},
    {id:'construction', label:'Construction',   sub:'Business plan, scénarios financiers'},
    {id:'recommandations',label:'Recommandations',sub:'Décisions investissement, optimisation des ressources'},
    {id:'restitution',  label:'Restitution',    sub:'Livrables structurés, tableaux, projections'}
  ],
  affaires: [
    {id:'cadrage',      label:'Cadrage',        sub:'Public cible, objectif du sondage'},
    {id:'conception',   label:'Conception',     sub:'Création du questionnaire'},
    {id:'collecte',     label:'Collecte',       sub:'Diffusion à l\'échantillon cible'},
    {id:'analyse',      label:'Analyse',        sub:'Traitement statistique, interprétation'},
    {id:'recommandations',label:'Recommandations',sub:'Compréhension des attentes, aide à la décision'},
    {id:'restitution',  label:'Restitution',    sub:'Rapport + synthèse décisionnelle'}
  ]
};

function getTypeKey(t) {
  if (!t) return 'marche';
  var tl = (t||'').toLowerCase();
  if (tl.includes('march')||tl.includes('strat')||tl.includes('bench')||tl.includes('veille')||tl.includes('lancement')) return 'marche';
  if (tl.includes('market')||tl.includes('not')||tl.includes('satisf')||tl.includes('com')||tl.includes('plan')) return 'marketing';
  if (tl.includes('finan')||tl.includes('audit')||tl.includes('business')||tl.includes('rse')||tl.includes('myst')) return 'finance';
  if (tl.includes('public')||tl.includes('sondage')||tl.includes('opinion')) return 'affaires';
  return 'marche';
}

function buildDefaultPhases(typeKey) {
  var defs = PHASES_DEF[typeKey] || PHASES_DEF.marche;
  return defs.map(function(p) {
    return {id:p.id, label:p.label, sub:p.sub, ordre:defs.indexOf(p)+1,
            jeh_total:0, montant_jeh:0, actif:true, intervenants:[]};
  });
}

// ── Calculs financiers ────────────────────────────────────────
function calcPhase(ph) {
  var total = (ph.jeh_total||0) * (ph.montant_jeh||0);
  var brut_iv = total * 0.5;
  var part_je = total * 0.5;
  return {montant_total: total, montant_brut_iv: brut_iv, part_je: part_je};
}

function calcEtude(phases) {
  var jeh = 0, montant = 0, brut = 0, je = 0;
  (phases||[]).filter(function(p){return p.actif;}).forEach(function(p) {
    jeh += (p.jeh_total||0);
    var c = calcPhase(p);
    montant += c.montant_total;
    brut += c.montant_brut_iv;
    je += c.part_je;
  });
  return {jeh_total: jeh, montant_ht: montant, montant_brut_iv: brut, part_je: je};
}

function fmtM(n) { return Number(n||0).toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:0})+' €'; }
function fmtJEH(n) { return (n||0)+' JEH'; }

function getMyPhasesInEtude(e) {
  var myPhases = [];
  (e.phases||[]).forEach(function(ph) {
    (ph.intervenants||[]).forEach(function(iv) {
      if (iv.intervenant_id===MY_IV_ID || (iv.email||'').toLowerCase()===ME.toLowerCase()) {
        myPhases.push({phase:ph, assignment:iv});
      }
    });
  });
  return myPhases;
}

function renderList(list,cid,isActive){
  if(!list.length){
    document.getElementById(cid).innerHTML='<div class="empty-state"><div class="empty-icon">'+(isActive?'🎯':'✅')+'</div><div class="empty-title">'+(isActive?'Aucune mission en cours':'Aucune mission terminée')+'</div><div class="empty-sub">'+(isActive?'Tu seras notifié dès qu\'une mission t\'est assignée.':'Tes missions terminées apparaîtront ici.')+'</div></div>';
    return;
  }
  var SC={Signé:'s-signe','En cours':'s-encours',Livré:'s-livre',Clôturé:'s-cloture',Facturé:'s-livre'};
  document.getElementById(cid).innerHTML=list.map(function(e){
    var myIv=(e.intervenants||[]).find(function(i){return i.intervenant_id===MY_IV_ID||(i.email||'').toLowerCase()===ME.toLowerCase();})||{};
    var tk=getTypeKey(e.type_etude||'');var td=STUDY_TYPES[tk];
    var p=e.date_debut?e.date_debut.split('-'):null;
    var day=p?p[2]:'—';var mo=p?MOIS_S[parseInt(p[1])-1]:'';
    // Get my assigned phases from étude phases
    var myPhasesList = getMyPhasesInEtude(e);
    var totalMyJeh = myPhasesList.reduce(function(a,mp){return a+(parseFloat(mp.assignment.jeh)||0);},0);
    var totalMyBrut = myPhasesList.reduce(function(a,mp){return a+(parseFloat(mp.assignment.montant_brut)||0);},0);
    var donePhasesCount = myPhasesList.filter(function(mp){return (mp.assignment.phases_done||[]).includes(mp.phase.id);}).length;
    var pct = myPhasesList.length > 0 ? Math.round(donePhasesCount/myPhasesList.length*100) : 0;
    var canQ = e.statut==='Livré' && questionnaire && !(myPhasesList[0]&&myPhasesList[0].assignment.questionnaire_soumis);
    var bar = myPhasesList.map(function(mp){
      var isDone = (mp.assignment.phases_done||[]).includes(mp.phase.id);
      return '<div class="phase-seg" style="flex:1;border-radius:99px;height:6px;background:'+(isDone?'var(--bordeaux)':'var(--border)')+'"></div>';
    }).join('');
    var phList = myPhasesList.map(function(mp) {
      var ph=mp.phase; var asn=mp.assignment;
      var isDone=(asn.phases_done||[]).includes(ph.id);
      var pNote=(asn.phase_notes||{})[ph.id]||'';
      var pLiv=(asn.phase_livrables||{})[ph.id]||'';
      var pDate=(asn.phase_dates||{})[ph.id]||'';
      return '<div class="phase-item">'+
        '<div class="phase-check '+(isDone?'done':'')+'" onclick="togglePhaseNew(\''+e.id+'\',\''+ph.id+'\')">'+(isDone?'✓':'')+'</div>'+
        '<div style="flex:1;min-width:0">'+
          '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'+
            '<div class="phase-name">'+ph.label+(pDate?' <span style="font-size:10px;color:var(--text-tertiary)">· '+fmtD(pDate)+'</span>':'')+'</div>'+
            '<span style="font-size:11px;color:var(--bordeaux);font-weight:600">'+asn.jeh+' JEH</span>'+
            '<span style="font-size:11px;color:var(--success);font-weight:600">'+fmtM(asn.montant_brut)+'</span>'+
          '</div>'+
          '<div class="phase-sub">'+ph.sub+'</div>'+

        '<div class="mc-info">'+
          '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'+
            '<span class="mc-ref">'+esc(e.reference||'—')+'</span>'+
            '<span class="badge '+(SC[e.statut]||'')+'">'+e.statut+'</span>'+
            '<span class="mc-type-badge '+td.badge+'">'+td.icon+' '+td.label+'</span>'+
          '</div>'+
          '<div class="mc-title">'+esc(e.title||'Sans titre')+'</div>'+
          '<div style="font-size:12px;color:var(--text-tertiary);margin-top:3px">'+esc(e.client_name||'—')+'</div>'+
          (e.description?'<div style="font-size:13px;color:var(--text-secondary);margin-top:6px;line-height:1.5">'+esc(e.description)+'</div>':'')+
          (e.type_etude?'<div style="font-size:11px;color:var(--text-tertiary);margin-top:4px">📌 '+esc(e.type_etude)+'</div>':'')+
        '</div>'+
        '<div style="text-align:right;flex-shrink:0">'+
          '<div style="font-size:26px;font-weight:800;color:var(--bordeaux)">'+pct+'%</div>'+
          '<div style="font-size:10px;color:var(--text-tertiary)">avancement</div>'+
          (totalMyBrut?'<div style="font-size:13px;font-weight:700;color:var(--success);margin-top:6px">'+fmtM(totalMyBrut)+'</div><div style="font-size:10px;color:var(--text-tertiary)">brut total</div>':'')+
        '</div>'+
      '</div>'+
      '<div class="mc-stats">'+
        '<div class="mc-stat"><div class="mc-stat-val">'+fmtD(e.date_debut)+'</div><div class="mc-stat-lbl">Début</div></div>'+
        '<div class="mc-stat"><div class="mc-stat-val">'+fmtD(e.date_fin)+'</div><div class="mc-stat-lbl">Fin prévue</div></div>'+
        '<div class="mc-stat"><div class="mc-stat-val">'+totalMyJeh+'</div><div class="mc-stat-lbl">Mes JEH</div></div>'+
        '<div class="mc-stat"><div class="mc-stat-val">'+fmtM(totalMyBrut)+'</div><div class="mc-stat-lbl">Brut total</div></div>'+
        '<div class="mc-stat"><div class="mc-stat-val">'+myPhasesList.length+'</div><div class="mc-stat-lbl">Phase(s) assignée(s)</div></div>'+
      '</div>'+
      '<div class="phase-track">'+
        '<div class="phase-title">Suivi des phases — '+td.label+'</div>'+
        '<div class="phases-bar">'+bar+'</div>'+
        phList+
        (canQ?'<div style="margin-top:12px"><button class="btn btn-primary btn-sm" onclick="openQ(\''+e.id+'\')">Questionnaire de fin d\'étude</button></div>':'')+
        (myPhasesList[0]&&myPhasesList[0].assignment.questionnaire_soumis?'<div style="margin-top:8px;font-size:12px;color:var(--success);font-weight:600">Questionnaire soumis</div>':'')+
      '</div>'+
    '</div>';
  }).join('');
}

function toggleExtra(id){var el=document.getElementById(id);if(el)el.classList.toggle('open');}

function getMyIvInPhase(e, phaseId) {
  var phase = (e.phases||[]).find(function(p){return p.id===phaseId;});
  if (!phase) return null;
  return (phase.intervenants||[]).find(function(i){
    return i.intervenant_id===MY_IV_ID || (i.email||'').toLowerCase()===ME.toLowerCase();
  });
}

function togglePhaseNew(etudeId, phaseId) {
  var e = myMissions.find(function(x){return x.id===etudeId;});
  if (!e) return;
  var phases = JSON.parse(JSON.stringify(e.phases||[]));
  var phIdx = phases.findIndex(function(p){return p.id===phaseId;});
  if (phIdx < 0) return;
  var ivIdx = (phases[phIdx].intervenants||[]).findIndex(function(i){
    return i.intervenant_id===MY_IV_ID || (i.email||'').toLowerCase()===ME.toLowerCase();
  });
  if (ivIdx < 0) return;
  var pd = phases[phIdx].intervenants[ivIdx].phases_done || [];
  if (pd.includes(phaseId)) {
    pd = pd.filter(function(p){return p!==phaseId;});
  } else {
    pd.push(phaseId);
    if (!phases[phIdx].intervenants[ivIdx].phase_dates) phases[phIdx].intervenants[ivIdx].phase_dates = {};
    phases[phIdx].intervenants[ivIdx].phase_dates[phaseId] = new Date().toISOString().split('T')[0];
  }
  phases[phIdx].intervenants[ivIdx].phases_done = pd;
  var updates = {phases: phases};
  if (pd.length > 0 && e.statut === 'Signé') updates.statut = 'En cours';
  db.collection('etudes').doc(etudeId).update(updates);
}

function savePNNew(etudeId, phaseId, val) {
  var e = myMissions.find(function(x){return x.id===etudeId;});
  if (!e) return;
  var phases = JSON.parse(JSON.stringify(e.phases||[]));
  var phIdx = phases.findIndex(function(p){return p.id===phaseId;});
  if (phIdx < 0) return;
  var ivIdx = (phases[phIdx].intervenants||[]).findIndex(function(i){
    return i.intervenant_id===MY_IV_ID || (i.email||'').toLowerCase()===ME.toLowerCase();
  });
  if (ivIdx < 0) return;
  if (!phases[phIdx].intervenants[ivIdx].phase_notes) phases[phIdx].intervenants[ivIdx].phase_notes = {};
  phases[phIdx].intervenants[ivIdx].phase_notes[phaseId] = val;
  db.collection('etudes').doc(etudeId).update({phases:phases});
}

function savePLNew(etudeId, phaseId, val) {
  var e = myMissions.find(function(x){return x.id===etudeId;});
  if (!e) return;
  var phases = JSON.parse(JSON.stringify(e.phases||[]));

function renderLiens(){
  var nCount=myDocs.filter(function(d){return!d.vu_par_intervenant&&d.lien_gdrive;}).length;
  var nb=document.getElementById('new-badge');
  if(nCount>0){nb.style.display='';nb.innerText=nCount;}else{nb.style.display='none';}
  if(!myDocs.length){
    document.getElementById('mmp-liens').innerHTML='<div class="empty-state"><div class="empty-icon">📂</div><div class="empty-title">Aucun document disponible</div><div class="empty-sub">Tes documents apparaîtront ici dès qu\'ils sont mis en ligne.</div></div>';
    return;
  }
  var ICONS={RM:{ico:'📄',cls:'rm'},CE:{ico:'📋',cls:'ce'},BV:{ico:'💰',cls:'bv'}};
  document.getElementById('mmp-liens').innerHTML=myDocs.map(function(d){
    var isNew=!d.vu_par_intervenant&&d.lien_gdrive;
    var ic=ICONS[d.type]||{ico:'📎',cls:'rm'};
    return '<div class="lien-card '+(isNew?'nouveau':'')+'">'+
      '<div class="lien-icon '+ic.cls+'">'+ic.ico+'</div>'+
      '<div style="flex:1;min-width:0">'+
        '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'+
          '<div style="font-weight:600;font-size:13px;color:var(--navy)">'+esc(d.nom_affiche||d.type||'Document')+'</div>'+
          (isNew?'<span class="new-badge">Nouveau</span>':'')+
        '</div>'+
        '<div style="font-size:11px;color:var(--text-tertiary);font-family:monospace;margin-top:2px">'+esc(d.etude_ref||'')+'</div>'+
        (!d.lien_gdrive?'<div style="font-size:11px;color:var(--text-tertiary);margin-top:3px;font-style:italic">En attente de mise en ligne…</div>':'')+
      '</div>'+
      (d.lien_gdrive?'<a href="'+d.lien_gdrive+'" target="_blank" onclick="markVu(\''+d.id+'\')" class="btn btn-primary btn-sm">📥 Ouvrir</a>':'')+
    '</div>';
  }).join('');
}

function markVu(id){db.collection('documents').doc(id).update({vu_par_intervenant:true});}

function openQ(eid){
  if(!questionnaire){alert('Aucun questionnaire actif.');return;}
  curQId=eid;
  var qs=questionnaire.questions||[];
  document.getElementById('q-content').innerHTML='<p style="font-size:13px;color:var(--text-secondary);margin-bottom:14px;line-height:1.6">Ce questionnaire est transmis au responsable qualité. Tes retours sont précieux.</p>'+
    qs.map(function(q,i){
      var inp='';
      if(q.type==='texte')inp='<textarea class="input" id="qa-'+i+'" rows="3" style="resize:vertical" placeholder="Ta réponse…"></textarea>';
      else if(q.type==='note')inp='<div id="qa-'+i+'" data-val="0" style="display:flex;gap:8px">'+[1,2,3,4,5].map(function(n){return'<span style="font-size:24px;cursor:pointer;color:#d1d5db" onclick="setQS('+i+','+n+')">&#9733;</span>';}).join('')+'</div>';
      else if(q.type==='oui_non')inp='<div style="display:flex;gap:16px"><label style="cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px"><input type="radio" name="qa'+i+'" value="Oui"/> Oui</label><label style="cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px"><input type="radio" name="qa'+i+'" value="Non"/> Non</label></div>';
      else if(q.type==='choix')inp=(q.options||[]).map(function(o){return'<label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;margin-bottom:4px"><input type="checkbox" name="qa'+i+'" value="'+esc(o)+'"/> '+esc(o)+'</label>';}).join('');
      return'<div style="margin-bottom:18px"><div style="font-size:13px;font-weight:600;color:var(--navy);margin-bottom:4px">'+(i+1)+'. '+esc(q.question||'')+'</div>'+(q.description?'<div style="font-size:11px;color:var(--text-tertiary);margin-bottom:6px">'+esc(q.description)+'</div>':'')+inp+'</div>';
    }).join('');
  document.getElementById('modal-q').classList.add('open');
}

function setQS(i,n){
  var el=document.getElementById('qa-'+i);if(!el)return;
  el.dataset.val=n;
  el.querySelectorAll('span').forEach(function(s,si){s.style.color=si<n?'#f59e0b':'#d1d5db';});
}

function closeQ(){document.getElementById('modal-q').classList.remove('open');curQId=null;}

function submitQ(){
  if(!curQId||!questionnaire)return;
  var qs=questionnaire.questions||[];
  var rep=qs.map(function(q,i){
    var v='';
    if(q.type==='texte'){var el=document.getElementById('qa-'+i);v=el?el.value.trim():'';}
    else if(q.type==='note'){var el2=document.getElementById('qa-'+i);v=el2?el2.dataset.val||0:0;}
    else if(q.type==='oui_non'){var ck=document.querySelector('input[name="qa'+i+'"]:checked');v=ck?ck.value:'';}
    else if(q.type==='choix'){v=Array.from(document.querySelectorAll('input[name="qa'+i+'"]:checked')).map(function(c){return c.value;}).join(', ');}
    return{question:q.question,reponse:v};
  });
  db.collection('questionnaire_reponses').add({
    questionnaire_id:questionnaire.id,etude_id:curQId,
    intervenant_id:MY_IV_ID,intervenant_email:ME,intervenant_nom:MY_NAME,
    reponses:rep,soumis_le:new Date().toISOString().split('T')[0],
    created_at:firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    var e=myMissions.find(function(x){return x.id===curQId;});
    if(e){
      var ivs=JSON.parse(JSON.stringify(e.intervenants||[]));
      var ii=getIvIdx(e);
      if(ii>=0){ivs[ii].questionnaire_soumis=true;db.collection('etudes').doc(curQId).update({intervenants:ivs});}
    }
    closeQ();
    alert('Merci, ton questionnaire a été soumis.');
  });
}
