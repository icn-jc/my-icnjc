<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Mes missions — My-ICN-JC</title>

<link rel="stylesheet" href="../assets/css/global.css"/>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script src="../assets/js/firebase.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/sidebar.js"></script>

<style>
/* ton CSS inchangé */
</style>
</head>

<body>

<div class="login-page" id="login-page">
  <div class="login-box">
    <div class="login-logo">
      <img src="../assets/images/ICN-Junior-Conseil_logo.png" style="height:54px;object-fit:contain"/>
    </div>
    <div class="login-title">Connexion</div>
    <div class="login-sub">Accès réservé aux membres ICN Junior Conseil.</div>

    <button class="google-btn" onclick="doGoogleLogin()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google"/>
      Se connecter avec Google
    </button>

    <div class="denied-box" id="denied-box">
      <strong>Accès refusé</strong>
      <p id="denied-msg"></p>
    </div>

    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div class="app-page" id="app-page">
  <div id="sidebar-container"></div>

  <div class="app-content">
    <div class="page-header">
      <div class="page-title">Mes missions</div>
      <div class="page-subtitle" id="page-sub"></div>
    </div>

    <div class="page-body">

      <div class="mm-tabs">
        <button class="mm-tab active" onclick="switchTab('actives')" id="mmt-actives">🎯 En cours</button>
        <button class="mm-tab" onclick="switchTab('historique')" id="mmt-historique">📋 Historique</button>
        <button class="mm-tab" onclick="switchTab('liens')" id="mmt-liens">
          📂 Mes liens 
          <span id="new-badge" style="display:none;background:var(--bordeaux);color:white;border-radius:99px;padding:1px 7px;font-size:10px;margin-left:4px"></span>
        </button>
      </div>

      <div class="mm-pane active" id="mmp-actives">
        <div class="empty-state">
          <div class="empty-icon">⏳</div>
          <div class="empty-title">Chargement…</div>
        </div>
      </div>

      <div class="mm-pane" id="mmp-historique">
        <div class="empty-state">
          <div class="empty-icon">📋</div>
          <div class="empty-title">Chargement…</div>
        </div>
      </div>

      <div class="mm-pane" id="mmp-liens">
        <div class="empty-state">
          <div class="empty-icon">📂</div>
          <div class="empty-title">Chargement…</div>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-q" onclick="if(event.target===this)closeQ()">
  <div class="modal-box" style="max-width:600px">
    <div class="modal-header">
      <div class="modal-title">Questionnaire de fin d'étude</div>
      <button class="modal-close" onclick="closeQ()">x</button>
    </div>

    <div id="q-content"></div>

    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeQ()">Annuler</button>
      <button class="btn btn-primary" onclick="submitQ()">Soumettre</button>
    </div>
  </div>
</div>

<script>

/* ----------- UTILS ----------- */

function esc(s){
  return (s || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function fmtD(s){
  if(!s) return '—';
  var p = s.split('-');
  return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : s;
}

function fmtM(n){
  return Number(n||0).toLocaleString('fr-FR') + ' €';
}

/* ----------- VARIABLES ----------- */

var ME='', MY_ROLE='', MY_NAME='', MY_IV_ID=null;
var myMissions=[], myDocs=[];
var questionnaire=null, questionnaireId=null;

/* ----------- AUTH ----------- */

initAuth('mes_missions', function(user, role, profile){

  ME = user.email;
  MY_ROLE = role;

  db.collection('intervenants')
    .where('email','==',user.email)
    .limit(1)
    .get()
    .then(function(snap){
      if(!snap.empty){
        MY_IV_ID = snap.docs[0].id;
      }
    });

  MY_NAME = ((profile.prenom||'')+' '+(profile.nom||'')).trim();

  renderSidebar(role, profile, user, 'mes_missions');
  showAppPage(user, role, profile);
  updateHealthIndicator();

  var now = new Date();
  var M = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

  document.getElementById('page-sub').innerText =
    (profile.prenom||'') + ' · ' +
    now.getDate() + ' ' + M[now.getMonth()] + ' ' + now.getFullYear();

  loadData();
});

/* ----------- DATA ----------- */

function loadData(){

  if (!db) {
    console.error("Firestore non initialisé");
    return;
  }

  db.collection('questionnaires')
    .where('actif','==',true)
    .limit(1)
    .get()
    .then(function(snap){
      if(!snap.empty){
        questionnaireId = snap.docs[0].id;
        questionnaire = Object.assign(
          { id: snap.docs[0].id },
          snap.docs[0].data()
        );
      } else {
        console.warn("Aucun questionnaire actif");
      }
    })
    .catch(function(err){
      console.error("Erreur Firestore :", err);
    });
}

/* ----------- TABS ----------- */

function switchTab(tab){

  document.querySelectorAll('.mm-tab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.mm-pane').forEach(p=>p.classList.remove('active'));

  document.getElementById('mmt-'+tab).classList.add('active');
  document.getElementById('mmp-'+tab).classList.add('active');
}

/* ----------- MODAL ----------- */

function closeQ(){
  document.getElementById('modal-q').style.display = 'none';
}

function submitQ(){
  console.log("Soumission questionnaire");
}

</script>

</body>
</html>
