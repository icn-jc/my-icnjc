<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Intervenants — My-ICN-JC</title>
<link rel="stylesheet" href="../assets/css/global.css"/>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
.iv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.iv-card{background:var(--bg-card);border-radius:var(--radius-lg);padding:14px 16px;border:1px solid var(--border);cursor:pointer;transition:all .15s;box-shadow:var(--shadow-sm);}
.iv-card:hover{box-shadow:var(--shadow-md);border-color:var(--bordeaux);transform:translateY(-1px);}
.iv-card.actif{border-left:3px solid var(--success);}
.iv-card.inactif{border-left:3px solid var(--text-tertiary);}
.iv-card.mission{border-left:3px solid #f59e0b;}
.iv-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--bordeaux),#d4527f);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:white;flex-shrink:0;}
.iv-name{font-weight:700;font-size:14px;color:var(--navy);}
.iv-role{font-size:11px;color:var(--text-tertiary);}
.dispo-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;}
.dispo-dispo{background:#dcfce7;color:#14532d;}
.dispo-mission{background:#fef3c7;color:#78350f;}
.dispo-indispo{background:#fee2e2;color:#991b1b;}
.comp-tag{display:inline-block;background:rgba(163,33,95,0.08);color:var(--bordeaux);border-radius:99px;padding:2px 8px;font-size:10px;font-weight:600;margin:2px;}
/* Panel */
.iv-panel{position:fixed;right:0;top:0;bottom:0;width:540px;max-width:96vw;background:var(--white);box-shadow:-8px 0 40px rgba(27,42,74,0.18);z-index:400;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease;}
.iv-panel.open{transform:translateX(0);}
.ivp-header{padding:18px 22px;border-bottom:1px solid var(--border);position:relative;display:flex;gap:14px;align-items:center;}
.ivp-close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-tertiary);}
.ivp-tabs{display:flex;border-bottom:1px solid var(--border);}
.ivp-tab{flex:1;padding:10px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:transparent;font-family:'Sora',sans-serif;color:var(--text-secondary);border-bottom:2px solid transparent;transition:all .15s;}
.ivp-tab.active{color:var(--bordeaux);border-bottom-color:var(--bordeaux);}
.ivp-pane{display:none;flex:1;overflow-y:auto;padding:18px 22px;}
.ivp-pane.active{display:block;}
.overlay{position:fixed;inset:0;background:rgba(15,25,35,0.35);z-index:399;display:none;}
.overlay.open{display:block;}
.sec{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-tertiary);margin-bottom:8px;margin-top:16px;display:flex;align-items:center;gap:8px;}
.sec::after{content:'';flex:1;height:1px;background:var(--border);}
.sec:first-child{margin-top:0;}
.mission-item{background:var(--bg);border-radius:var(--radius-md);padding:10px 12px;border:1px solid var(--border);margin-bottom:8px;}
.toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.toolbar select,.toolbar input{padding:6px 10px;border-radius:var(--radius-md);border:1.5px solid var(--border-strong);font-family:'Sora',sans-serif;font-size:12px;background:var(--white);}
</style>
</head>
<body>
<div class="login-page" id="login-page">
  <div class="login-box">

    <div class="login-title">Connexion</div>
    <div class="login-sub">Accès réservé aux membres ICN Junior Conseil.</div>
    <button class="google-btn" onclick="doGoogleLogin()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google"/>Se connecter avec Google
    </button>
    <div class="denied-box" id="denied-box"><strong>Accès refusé</strong><p id="denied-msg"></p></div>

  </div>
</div>

<div class="app-page" id="app-page">
  <div id="sidebar-container"></div>
  <div class="app-content">
    <div class="page-header">
      <div class="flex justify-between items-center" style="flex-wrap:wrap;gap:10px">
        <div><div class="page-title">Intervenants</div><div class="page-subtitle" id="page-subtitle"></div></div>
        <div class="flex gap-2">
          <button class="btn btn-primary btn-sm" id="btn-add" onclick="openAdd()" style="display:none">+ Intervenant</button>

        </div>
      </div>
    </div>
    <div class="page-body">
      <!-- Dashboard récap -->
      <div id="iv-dashboard" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:20px"></div>

      <div class="toolbar">
        <input type="text" id="srch" placeholder="🔍 Nom, compétence…" oninput="render()"/>
        <select id="f-dispo" onchange="render()">
          <option value="">Disponibilité</option>
          <option value="Disponible">✅ Disponible</option>
          <option value="En mission">🟡 En mission</option>
          <option value="Indisponible">🔴 Indisponible</option>
        </select>
        <select id="f-statut" onchange="render()">
          <option value="">Statut</option>
          <option value="Actif">Actif</option>
          <option value="Inactif">Inactif</option>
          <option value="Ancien membre">Ancien membre</option>
        </select>
        <select id="f-situation" onchange="render()" style="padding:6px 10px;border-radius:var(--radius-md);border:1.5px solid var(--border-strong);font-family:'Sora',sans-serif;font-size:12px;background:var(--white)">
          <option value="">Situation</option>
          <option>Étudiant</option><option>Alternance</option><option>Stage</option>
          <option>Diplômé</option><option>En recherche d'emploi</option><option>En poste</option><option>Autre</option>
        </select>
        <select id="f-ville" onchange="render()" style="padding:6px 10px;border-radius:var(--radius-md);border:1.5px solid var(--border-strong);font-family:'Sora',sans-serif;font-size:12px;background:var(--white)">
          <option value="">Toutes villes</option>
        </select>
        <button class="btn btn-secondary btn-sm" onclick="clearFilters()">Réinitialiser</button>
        <span id="iv-filter-count" style="font-size:11px;color:var(--text-tertiary);font-style:italic"></span>
        <span style="font-size:11px;color:var(--text-tertiary);font-style:italic" id="f-note"></span>
      </div>
      <div class="iv-grid" id="iv-grid">
        <div style="color:var(--text-tertiary);font-size:13px">Chargement…</div>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closePanel()"></div>

<!-- PANNEAU INTERVENANT -->
<div class="iv-panel" id="iv-panel">

</div>

          <option value="En recherche d'emploi">En recherche d'emploi</option>

    <div class="modal-actions">

  </div>
</div>

function localDateStr(d) { return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtD(s) { if (!s) return '—'; var p=s.split('-'); return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s; }
function fmtM(n) { return Number(n||0).toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:0})+' €'; }
function ini(iv) { return ((iv.prenom||'?')[0]+(iv.nom||'?')[0]).toUpperCase(); }

initAuth('crm_intervenants', function(user, role, profile) {
  ME = user.email; MY_ROLE = role;
  CAN_EDIT = EDIT_ROLES_IV.includes(role);
  renderSidebar(role, profile, user, 'crm_intervenants');
  showAppPage(user, role, profile);
  updateHealthIndicator();
  if (CAN_EDIT) document.getElementById('btn-add').style.display = 'flex';
  var now = new Date();
  var M=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  document.getElementById('page-subtitle').innerText = now.getDate()+' '+M[now.getMonth()]+' '+now.getFullYear();
  loadData();
});

function loadData() {
  db.collection('etudes').onSnapshot(function(snap) {
    allEtudes = [];
    snap.forEach(function(doc){allEtudes.push(Object.assign({id:doc.id},doc.data()));});
    render(); // refresh cards avec missions à jour
  });

  db.collection('intervenants').onSnapshot(function(snap) {
    allIntervenants = [];
    snap.forEach(function(doc){allIntervenants.push(Object.assign({id:doc.id},doc.data()));});
    if (allIntervenants.length === 0) seedIntervenants();
    else render();
  });
}

function seedIntervenants() {
  var batch = db.batch();
  SEED_INTERVENANTS.forEach(function(iv) {
    var ref = db.collection('intervenants').doc();
    batch.set(ref, Object.assign({
      tel:'',ville:'',adresse:'',date_naissance:'',nationalite:'Française',
      ecole:'ICN Business School',niveau_etudes:'',specialite:'',
      iban:'',competences:[],langues:['Français'],
      disponibilite:'Disponible',statut:'Actif',situation:'Étudiant',
      nb_missions:0,ca_genere:0,notes:'',
      created_at:firebase.firestore.FieldValue.serverTimestamp()
    }, iv));
  });
  batch.commit();
}

function renderDashboard(filtered) {
  var data = filtered || allIntervenants;
  var total = data.length;
  var dispo = data.filter(function(iv){return iv.disponibilite==='Disponible';}).length;
  var mission = data.filter(function(iv){return iv.disponibilite==='En mission';}).length;
  var indispo = data.filter(function(iv){return iv.disponibilite==='Indisponible';}).length;
  var actifs = data.filter(function(iv){return iv.statut==='Actif';}).length;
  var el = document.getElementById('iv-dashboard');
  if (!el) return;
  el.innerHTML = [
    {label:'Total', val:total, color:'var(--navy)', bg:'rgba(27,42,74,0.07)'},
    {label:'Disponibles', val:dispo, color:'#14532d', bg:'#dcfce7'},
    {label:'En mission', val:mission, color:'#78350f', bg:'#fef3c7'},
    {label:'Indisponibles', val:indispo, color:'#991b1b', bg:'#fee2e2'},
    {label:'Actifs', val:actifs, color:'var(--bordeaux)', bg:'rgba(163,33,95,0.08)'},
  ].map(function(k){
    return '<div style="background:'+k.bg+';border-radius:var(--radius-lg);padding:14px 16px;">' +
      '<div style="font-size:24px;font-weight:800;color:'+k.color+'">'+k.val+'</div>' +
      '<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:'+k.color+';opacity:.7;margin-top:3px">'+k.label+'</div>' +
    '</div>';
  }).join('');
}

function getFilteredData() {
  var srch = (document.getElementById('srch').value||'').toLowerCase();
  var fd = document.getElementById('f-dispo').value;
  var fs = document.getElementById('f-statut').value;
  var fsi = document.getElementById('f-situation') ? document.getElementById('f-situation').value : '';
  var fv = document.getElementById('f-ville') ? document.getElementById('f-ville').value : '';
  return allIntervenants.filter(function(iv) {
    var name = ((iv.prenom||'')+' '+(iv.nom||'')).toLowerCase();
    var comp = (iv.competences||[]).join(' ').toLowerCase();
    if (srch && !name.includes(srch) && !comp.includes(srch)) return false;
    if (fd && iv.disponibilite !== fd) return false;
    if (fs && iv.statut !== fs) return false;
    if (fsi && iv.situation !== fsi) return false;
    if (fv && (iv.ville||'').toLowerCase() !== fv.toLowerCase()) return false;
    return true;
  }).sort(function(a,b){return (a.nom||'').localeCompare(b.nom||'');});
}

function populateVilleFilter() {
  var sel = document.getElementById('f-ville');
  if (!sel) return;
  var cur = sel.value;
  var villes = [];
  allIntervenants.forEach(function(iv) {
    var v = (iv.ville||'').trim();
    if (v && !villes.includes(v)) villes.push(v);
  });
  villes.sort();
  sel.innerHTML = '<option value="">Toutes villes</option>' +
    villes.map(function(v) {
      return '<option value="'+v+'"'+(cur===v?' selected':'')+'>'+v+'</option>';
    }).join('');
}

function render() {
  populateVilleFilter();
  var data = getFilteredData();

  // Dashboard dynamique basé sur les données filtrées
  renderDashboard(data);

  document.getElementById('f-note').innerText = data.length < allIntervenants.length ? data.length+' / '+allIntervenants.length+' intervenants' : '';
  var countEl = document.getElementById('iv-filter-count');
  if (countEl) countEl.innerText = data.length < allIntervenants.length ? data.length+' résultat(s)' : '';

  var dispoCls = {Disponible:'dispo',　'En mission':'mission',Indisponible:'indispo'};
  document.getElementById('iv-grid').innerHTML = data.length === 0
    ? '<div style="color:var(--text-tertiary);font-size:13px">Aucun intervenant.</div>'
    : data.map(function(iv) {
        var nbM = allEtudes.filter(function(e){return (e.intervenants||[]).some(function(i){return i.intervenant_id===iv.id;});}).length;
        var dc = dispoCls[iv.disponibilite]||'dispo';
        var sc = iv.statut==='Actif'?'actif':iv.statut==='En mission'?'mission':'inactif';
        var comps = (iv.competences||[]).slice(0,3).map(function(c){return '<span class="comp-tag">'+c+'</span>';}).join('');
        // 3 dernières missions
        var myM = allEtudes.filter(function(e){return (e.intervenants||[]).some(function(i){return i.intervenant_id===iv.id;});});
        myM.sort(function(a,b){return (b.created_at_str||'').localeCompare(a.created_at_str||'');});
        var lastM = myM.slice(0,3).map(function(e){
          return '<span class="comp-tag" style="background:rgba(27,42,74,0.07);color:var(--navy);font-size:9px">'+(e.reference||'')+(e.title?' · '+e.title.slice(0,16)+(e.title.length>16?'…':''):'')+'</span>';
        }).join('');
        // Période dispo
        var dispoPeriod = (iv.dispo_debut||iv.dispo_fin)
          ? '<div style="font-size:10px;color:var(--text-tertiary);margin-top:4px">📅 '+(iv.dispo_debut?fmtD(iv.dispo_debut):'?')+' → '+(iv.dispo_fin?fmtD(iv.dispo_fin):'?')+'</div>'
          : '';
        return '<div class="iv-card '+sc+'" onclick="openIv(\''+iv.id+'\')">' +
          '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">' +
            '<div class="iv-avatar">'+ini(iv)+'</div>' +
            '<div style="flex:1;min-width:0">' +
              '<div class="iv-name">'+(iv.prenom||'')+' '+(iv.nom||'')+'</div>' +
              '<div class="iv-role">'+(iv.specialite||iv.ecole||'—')+
                (iv.ville?' <span style="opacity:.7">· 📍'+iv.ville+'</span>':'')+'</div>' +
              (iv.situation?'<div style="font-size:10px;color:var(--text-tertiary);margin-top:1px">'+iv.situation+'</div>':'') +
            '</div>' +
            '<span class="dispo-badge dispo-'+dc+'">'+(iv.disponibilite||'—')+'</span>' +
          '</div>' +
          dispoPeriod +
          (comps?'<div style="margin-top:6px">'+comps+'</div>':'') +
          (lastM?'<div style="margin-top:7px;padding-top:7px;border-top:1px solid var(--border)"><div style="font-size:9px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px">Dernières missions</div>'+lastM+'</div>':'') +
          '<div style="font-size:11px;color:var(--text-tertiary);margin-top:6px">'+nbM+' mission(s) au total</div>' +
        '</div>';
      }).join('');
}

function clearFilters() {
  ['srch','f-dispo','f-statut','f-situation','f-ville'].forEach(function(id){
    var el = document.getElementById(id); if(el) el.value='';
  });
  render();
}

// ── Panel intervenant ─────────────────────────────────────────
function openIv(id) {
  var iv = allIntervenants.find(function(x){return x.id===id;});
  if (!iv) return;
  curIvId = id;
  document.getElementById('ivp-avatar').innerText = ini(iv);
  document.getElementById('ivp-name').innerText = (iv.prenom||'')+' '+(iv.nom||'');
  document.getElementById('ivp-sub').innerText = (iv.specialite||'')+(iv.ecole?' · '+iv.ecole:'');
  var dc = {Disponible:'dispo-dispo','En mission':'dispo-mission',Indisponible:'dispo-indispo'}[iv.disponibilite]||'';
  document.getElementById('ivp-meta').innerHTML =
    '<span class="dispo-badge '+dc+'">'+(iv.disponibilite||'—')+'</span>' +
    (iv.statut?'<span style="font-size:11px;color:var(--text-tertiary)">'+iv.statut+'</span>':'') +
    (iv.ville?'<span style="font-size:11px;color:var(--text-tertiary)">📍 '+iv.ville+'</span>':'') +
    ((iv.dispo_debut||iv.dispo_fin)?'<span style="font-size:11px;color:var(--text-tertiary)">📅 '+fmtD(iv.dispo_debut)+' → '+fmtD(iv.dispo_fin)+'</span>':'');

  document.getElementById('ivt-edit').style.display = CAN_EDIT ? '' : 'none';
  document.getElementById('ivt-assigner').style.display = CAN_EDIT ? '' : 'none';

  renderIvInfos(iv);
  renderIvMissions(id);
  renderIvAssigner(iv);
  renderIvEdit(iv);
  switchTab('infos');
  document.getElementById('iv-panel').classList.add('open');
  document.getElementById('overlay').classList.add('open');
}

function closePanel() {
  document.getElementById('iv-panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
  curIvId = null;
}

function switchTab(key) {
  ['infos','missions','assigner','edit'].forEach(function(k){
    document.getElementById('ivt-'+k).classList.toggle('active',k===key);
    document.getElementById('ivp-'+k).classList.toggle('active',k===key);
  });
}

function fld(label, val) {
  return '<div style="display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)">' +
    '<div style="font-size:12px;color:var(--text-tertiary);width:130px;flex-shrink:0">'+label+'</div>' +
    '<div style="font-size:13px;color:var(--text-primary)">'+val+'</div></div>';
}

function renderIvInfos(iv) {
  var comps = (iv.competences||[]).map(function(c){return '<span class="comp-tag">'+c+'</span>';}).join('');
  var langs = (iv.langues||[]).map(function(l){return '<span class="comp-tag" style="background:rgba(27,42,74,0.08);color:var(--navy)">'+l+'</span>';}).join('');
  document.getElementById('ivp-infos').innerHTML =
    '<div class="sec">Coordonnées</div>' +
    fld('Email', iv.email||'—') + fld('Téléphone', iv.tel||'—') +
    fld('Ville', iv.ville||'—') + fld('Adresse', iv.adresse||'—') +
    '<div class="sec" style="margin-top:16px">Formation</div>' +
    fld('École', iv.ecole||'—') + fld('Niveau', iv.niveau_etudes||'—') +
    fld('Spécialité', iv.specialite||'—') + fld('Nationalité', iv.nationalite||'—') +
    fld('Date naissance', fmtD(iv.date_naissance)) +
    '<div class="sec" style="margin-top:16px">Compétences & Langues</div>' +
    (comps?'<div style="margin-bottom:8px">'+comps+'</div>':'<div style="font-size:12px;color:var(--text-tertiary);margin-bottom:8px">Aucune compétence renseignée</div>') +
    (langs?'<div>'+langs+'</div>':'') +
    '<div class="sec" style="margin-top:16px">Finances</div>' +
    fld('IBAN', iv.iban ? iv.iban.slice(0,8)+'…'+iv.iban.slice(-4) : '—') +
    fld('CA généré', fmtM(iv.ca_genere)) +
    (iv.dispo_debut||iv.dispo_fin ? fld('Période dispo', fmtD(iv.dispo_debut)+' → '+fmtD(iv.dispo_fin)) : '') +
    (iv.notes?'<div class="sec" style="margin-top:16px">Notes</div><div style="font-size:13px;color:var(--text-secondary);line-height:1.6">'+iv.notes+'</div>':'');
}

function renderIvMissions(ivId) {
  var missions = allEtudes.filter(function(e){
    return (e.intervenants||[]).some(function(i){return i.intervenant_id===ivId;});
  });
  var STATUT_CSS2 = {Signé:'s-signe','En cours':'s-encours',Livré:'s-livre',Clôturé:'s-cloture'};
  document.getElementById('ivp-missions').innerHTML = missions.length === 0
    ? '<div style="color:var(--text-tertiary);font-size:13px;text-align:center;padding:20px">Aucune mission assignée.</div>'
    : missions.map(function(e) {
        var iv2 = (e.intervenants||[]).find(function(i){return i.intervenant_id===ivId;}) || {};
        var sc = STATUT_CSS2[e.statut]||'';
        return '<div class="mission-item">' +
          '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px">' +
            '<span style="font-family:monospace;font-size:11px;font-weight:700;color:var(--bordeaux)">'+(e.reference||'—')+'</span>' +
            '<span class="badge '+sc+'">'+(e.statut||'—')+'</span>' +
          '</div>' +
          '<div style="font-weight:600;font-size:13px;color:var(--navy)">'+(e.title||'—')+'</div>' +
          '<div style="font-size:11px;color:var(--text-tertiary);margin-top:3px">'+(e.client_name||'—')+'</div>' +
          (iv2.montant_brut?'<div style="font-size:12px;font-weight:600;color:var(--bordeaux);margin-top:4px">Rémunération brute : '+fmtM(iv2.montant_brut)+'</div>':'') +
        '</div>';
      }).join('');
}

function renderIvAssigner(iv) {
  if (!CAN_EDIT) { document.getElementById('ivp-assigner').innerHTML = ''; return; }
  var etudesActives = allEtudes.filter(function(e){
    return ['Signé','En cours'].includes(e.statut) &&
           !(e.intervenants||[]).some(function(i){return i.intervenant_id===iv.id;});
  });
  document.getElementById('ivp-assigner').innerHTML =
    '<div style="font-size:13px;color:var(--text-secondary);margin-bottom:14px">Assigner '+(iv.prenom||'')+' à une étude</div>' +
    '<div class="form-field"><label class="input-label">Étude</label>' +
      '<select class="select-field" id="assign-etude"><option value="">— Choisir —</option>' +
      etudesActives.map(function(e){return '<option value="'+e.id+'">'+e.reference+' — '+e.title+'</option>';}).join('') +
      '</select></div>' +
    '<div class="form-field"><label class="input-label">Montant brut (€)</label><input class="input" type="number" id="assign-montant" placeholder="0"/></div>' +
    '<div class="form-field"><label class="input-label">Notes</label><input class="input" id="assign-notes" placeholder="Rôle, modalités…"/></div>' +
    '<button class="btn btn-primary" style="margin-top:8px" onclick="assignToEtude()">Assigner →</button>';
}

function assignToEtude() {
  var iv = allIntervenants.find(function(x){return x.id===curIvId;});
  if (!iv) return;
  var etudeId = document.getElementById('assign-etude').value;
  var montant = parseFloat(document.getElementById('assign-montant').value)||0;
  var notes = document.getElementById('assign-notes').value.trim();
  if (!etudeId) { alert('Merci de choisir une étude.'); return; }
  var etude = allEtudes.find(function(e){return e.id===etudeId;});
  if (!etude) return;
  var existing = etude.intervenants || [];
  existing.push({
    intervenant_id: curIvId,
    nom: (iv.prenom||'')+' '+(iv.nom||''),
    montant_brut: montant,
    notes: notes,
    statut: 'Assigné'
  });
  db.collection('etudes').doc(etudeId).update({intervenants: existing}).then(function() {
    // Créer le doc document pour gestion_docs
    db.collection('documents').add({
      type: 'RM',
      etude_id: etudeId,
      etude_ref: etude.reference||'',
      intervenant_id: curIvId,
      intervenant_nom: (iv.prenom||'')+' '+(iv.nom||''),
      nom_affiche: 'RM — '+(etude.reference||'')+(iv.nom?' — '+iv.prenom+' '+iv.nom:''),
      lien_gdrive: '',
      statut: 'en_attente_lien',
      vu_par_intervenant: false,
      created_at: firebase.firestore.FieldValue.serverTimestamp(),
      updated_at: firebase.firestore.FieldValue.serverTimestamp()
    });
    // MAJ disponibilité intervenant
    db.collection('intervenants').doc(curIvId).update({disponibilite:'En mission'});
    alert('✅ Assigné. Un RM a été créé dans Gestion documents.');
    renderIvAssigner(iv);
    renderIvMissions(curIvId);
  });
}

function renderIvEdit(iv) {
  if (!CAN_EDIT) { document.getElementById('ivp-edit').innerHTML = ''; return; }
  var id = iv.id;
  var dispoOpts = ['Disponible','En mission','Indisponible'].map(function(s){return '<option'+(iv.disponibilite===s?' selected':'')+'>'+s+'</option>';}).join('');
  var statOpts = ['Actif','Inactif','Ancien membre'].map(function(s){return '<option'+(iv.statut===s?' selected':'')+'>'+s+'</option>';}).join('');
  var niveauOpts = ['','L1','L2','L3','M1','M2','Diplômé','Autre'].map(function(s){return '<option'+(iv.niveau_etudes===s?' selected':'')+'>'+(s||'—')+'</option>';}).join('');
  document.getElementById('ivp-edit').innerHTML =
    '<div style="display:flex;flex-direction:column;gap:10px">' +
    ef('Prénom','text',iv.prenom||'','prenom',id)+ef('Nom','text',iv.nom||'','nom',id)+
    ef('Email','email',iv.email||'','email',id)+ef('Téléphone','text',iv.tel||'','tel',id)+
    ef('Ville','text',iv.ville||'','ville',id)+ef('Adresse','text',iv.adresse||'','adresse',id)+
    ef('Date naissance','date',iv.date_naissance||'','date_naissance',id)+
    ef('Nationalité','text',iv.nationalite||'','nationalite',id)+
    ef('École','text',iv.ecole||'','ecole',id)+
    ef('Niveau','select:'+niveauOpts,iv.niveau_etudes||'','niveau_etudes',id)+
    ef('Spécialité','text',iv.specialite||'','specialite',id)+
    ef('Situation','select:<option value="">—</option><option'+(iv.situation==='Étudiant'?' selected':'')+'>Étudiant</option><option'+(iv.situation==='Alternance'?' selected':'')+'>Alternance</option><option'+(iv.situation==='Stage'?' selected':'')+'>Stage</option><option'+(iv.situation==='Diplômé'?' selected':'')+'>Diplômé</option><option'+(iv.situation==="En recherche d'emploi"?' selected':'')+">En recherche d'emploi</option><option"+(iv.situation==='En poste'?' selected':'')+'>En poste</option><option'+(iv.situation==='Autre'?' selected':'')+'>Autre</option>',iv.situation||'','situation',id)+
    ef('Disponibilité','select:'+dispoOpts,iv.disponibilite||'','disponibilite',id)+
    ef('Statut','select:'+statOpts,iv.statut||'','statut',id)+
    ef('Compétences','text',(iv.competences||[]).join(', '),'competences_str',id)+
    ef('Langues','text',(iv.langues||[]).join(', '),'langues_str',id)+
    ef('Dispo — date début','date',iv.dispo_debut||'','dispo_debut',id)+
    ef('Dispo — date fin','date',iv.dispo_fin||'','dispo_fin',id)+
    ef('IBAN','text',iv.iban||'','iban',id)+
    ef('Notes','textarea',iv.notes||'','notes',id)+
    '</div>';
}

function ef(label, type, val, field, id) {
  var input;
  if (type.startsWith('select:')) {
    input = '<select class="select-field" style="font-size:12px" onchange="saveIvField(\''+id+'\',\''+field+'\',this.value)">'+type.slice(7)+'</select>';
  } else if (type === 'textarea') {
    input = '<textarea class="input" rows="3" style="font-size:12px;resize:vertical" onblur="saveIvField(\''+id+'\',\''+field+'\',this.value)">'+val+'</textarea>';
  } else {
    input = '<input class="input" type="'+type+'" value="'+val+'" style="font-size:12px" onblur="saveIvField(\''+id+'\',\''+field+'\',this.value)"/>';
  }
  return '<div><label class="input-label">'+label+'</label>'+input+'</div>';
}

function saveIvField(id, field, val) {
  var u = {};
  if (field === 'competences_str') { u.competences = val.split(',').map(function(s){return s.trim();}).filter(Boolean); }
  else if (field === 'langues_str') { u.langues = val.split(',').map(function(s){return s.trim();}).filter(Boolean); }
  else u[field] = val;
  db.collection('intervenants').doc(id).update(u);
}

// ── Ajout intervenant ─────────────────────────────────────────
function openAdd() { document.getElementById('modal-add').classList.add('open'); }
function closeAdd() { document.getElementById('modal-add').classList.remove('open'); }

function confirmAdd() {
  var prenom = document.getElementById('ni-prenom').value.trim();
  var nom = document.getElementById('ni-nom').value.trim();
  if (!prenom || !nom) { alert('Prénom et nom obligatoires.'); return; }
  db.collection('intervenants').add({
    prenom:prenom, nom:nom,
    email:document.getElementById('ni-email').value.trim(),
    tel:document.getElementById('ni-tel').value.trim(),
    ville:document.getElementById('ni-ville').value.trim(),
    adresse:document.getElementById('ni-adresse').value.trim(),
    date_naissance:document.getElementById('ni-ddn').value||'',
    nationalite:document.getElementById('ni-nat').value.trim()||'Française',
    ecole:document.getElementById('ni-ecole').value.trim(),
    niveau_etudes:document.getElementById('ni-niveau').value,
    specialite:document.getElementById('ni-spec').value.trim(),
    disponibilite:document.getElementById('ni-dispo').value,
    statut:document.getElementById('ni-statut').value,
    competences:document.getElementById('ni-comp').value.split(',').map(function(s){return s.trim();}).filter(Boolean),
    langues:document.getElementById('ni-langues').value.split(',').map(function(s){return s.trim();}).filter(Boolean),
    situation:document.getElementById('ni-situation').value,
    iban:document.getElementById('ni-iban').value.trim(),
    notes:document.getElementById('ni-notes').value.trim(),
    nb_missions:0, ca_genere:0,
    created_at:firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){closeAdd();});
}

function exportXLSX() {
  var rows = [['Prénom','Nom','Email','Tél','Ville','École','Niveau','Spécialité','Disponibilité','Statut','Compétences','Nb missions']];
  allIntervenants.forEach(function(iv){
    var nb = allEtudes.filter(function(e){return (e.intervenants||[]).some(function(i){return i.intervenant_id===iv.id;});}).length;
    rows.push([iv.prenom||'',iv.nom||'',iv.email||'',iv.tel||'',iv.ville||'',
      iv.ecole||'',iv.niveau_etudes||'',iv.specialite||'',iv.disponibilite||'',iv.statut||'',
      (iv.competences||[]).join(', '),nb]);
  });
  var ws = XLSX.utils.aoa_to_sheet(rows);
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Intervenants');
  XLSX.writeFile(wb, 'Intervenants_ICN_JC.xlsx');
}
