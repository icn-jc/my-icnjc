<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>CRM Prospection — My-ICN-JC</title>

<link rel="stylesheet" href="../assets/css/global.css"/>
<link rel="stylesheet" href="./css/crm.css"/>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script src="../assets/js/firebase.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/sidebar.js"></script>

<script src="./js/crmConfig.js"></script>
<script src="./js/crmStore.js"></script>
<script src="./js/crmHelpers.js"></script>
<script src="./js/crmFilters.js"></script>
<script src="./js/crmAnalytics.js"></script>
<script src="./js/crmTimeline.js"></script>
<script src="./js/crmEngine.js"></script>
<script src="./js/crmUI.js"></script>
</head>
<body>

<div class="login-page" id="login-page"></div>

<div class="app-page" id="app-page">

  <div id="sidebar-container"></div>

  <div class="app-content">

    <div class="crm-topbar">

      <div>
        <div class="page-title">CRM Prospection</div>
        <div class="page-subtitle">Gestion commerciale ICN Junior Conseil</div>
      </div>

      <div class="week-switcher">
        <button class="week-btn" onclick="previousWeek()">←</button>

        <div id="week-display"></div>

        <button class="week-btn" onclick="nextWeek()">→</button>
      </div>

    </div>

    <div class="stats-grid">

      <div class="stat-card">
        <div>Contactés</div>
        <div class="stat-value" id="stat-contactes">0</div>
      </div>

      <div class="stat-card">
        <div>RDV planifiés</div>
        <div class="stat-value" id="stat-rdv">0</div>
      </div>

      <div class="stat-card">
        <div>Propositions envoyées</div>
        <div class="stat-value" id="stat-propositions">0</div>
      </div>

      <div class="stat-card">
        <div>Négociations</div>
        <div class="stat-value" id="stat-negociations">0</div>
      </div>

      <div class="stat-card">
        <div>Signés</div>
        <div class="stat-value" id="stat-signes">0</div>
      </div>

      <div class="stat-card">
        <div>Perdus</div>
        <div class="stat-value" id="stat-perdus">0</div>
      </div>

    </div>

    <div class="pipeline-grid">

      <div class="stat-card">
        <div>Pipeline fiable</div>
        <div class="stat-value" id="pipeline-reliable">0€</div>
      </div>

      <div class="stat-card">
        <div>Pipeline incertain</div>
        <div class="stat-value" id="pipeline-uncertain">0€</div>
      </div>

      <div class="stat-card">
        <div>Taux conversion</div>
        <div class="stat-value" id="conversion-rate">0%</div>
      </div>

    </div>

    <div class="card" style="margin-top:24px">

      <div class="flex justify-between items-center" style="margin-bottom:18px">
        <div class="section-title">Tous les prospects</div>

        <button class="btn btn-primary" onclick="openCreateProspectModal()">
          + Ajouter un prospect
        </button>
      </div>

      <div class="crm-table-wrapper">

        <table class="crm-table">

          <thead>
            <tr>
              <th>Entreprise</th>
              <th>Statut</th>
              <th>Montant</th>
              <th>Commercial</th>
              <th>Dernière mise à jour</th>
            </tr>
          </thead>

          <tbody id="prospects-table"></tbody>

        </table>

      </div>

    </div>

  </div>

</div>

<script>

initAuth('crm_prospection', async function(user, role, profile){

  CRM_STORE.currentUser = user;
  CRM_STORE.currentRole = role;
  CRM_STORE.currentProfile = profile;

  renderSidebar(role, profile, user, 'crm_prospection');

  showAppPage(user, role, profile);

  setCurrentWeek();

  document.getElementById('week-display').innerText =
    'Semaine ' + CRM_STORE.selectedWeek + ' — ' + CRM_STORE.selectedYear;

  await loadUsers();

  await loadProspects();

  refreshCRM();
});

</script>

</body>
</html>
