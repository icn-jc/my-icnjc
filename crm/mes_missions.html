<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Mes missions — My-ICN-JC</title>
<link rel="stylesheet" href="../assets/css/global.css"/>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="../assets/js/firebase.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/sidebar.js"></script>
<style>
.mission-tabs{display:flex;gap:3px;background:var(--bg);border-radius:var(--radius-lg);padding:4px;border:1px solid var(--border);width:fit-content;margin-bottom:20px;flex-wrap:wrap;}
.mt-btn{padding:8px 16px;border-radius:var(--radius-md);font-size:13px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--text-secondary);font-family:'Sora',sans-serif;transition:all .2s;}
.mt-btn.active{background:var(--white);color:var(--bordeaux);box-shadow:var(--shadow-sm);font-weight:600;}
.mt-pane{display:none;}
.mt-pane.active{display:block;}
/* Mission card */
.mission-card{background:var(--bg-card);border-radius:var(--radius-lg);padding:18px 20px;border:1px solid var(--border);box-shadow:var(--shadow-sm);margin-bottom:14px;}
.mission-card.active{border-left:3px solid var(--bordeaux);}
.mission-card.done{border-left:3px solid var(--success);}
.mc-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
.mc-ref{font-family:monospace;font-size:12px;font-weight:700;color:var(--bordeaux);}
.mc-title{font-family:'Playfair Display',serif;font-size:16px;color:var(--navy);margin-top:3px;}
.mc-client{font-size:12px;color:var(--text-tertiary);margin-top:2px;}
.mc-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:12px;}
.mc-stat{background:var(--bg);border-radius:var(--radius-md);padding:8px 12px;}
.mc-stat-val{font-size:16px;font-weight:700;color:var(--navy);}
.mc-stat-lbl{font-size:10px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.06em;}
.badge{padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;}
.s-encours{background:#fef3c7;color:#78350f;}
.s-livre{background:#dbeafe;color:#1e3a5f;}
.s-cloture{background:#f1f5f9;color:#475569;}
.s-signe{background:#dcfce7;color:#14532d;}
/* Lien card */
.lien-card{background:var(--bg-card);border-radius:var(--radius-lg);padding:16px 18px;border:1px solid var(--border);margin-bottom:12px;display:flex;align-items:center;gap:14px;transition:box-shadow .15s;}
.lien-card:hover{box-shadow:var(--shadow-md);}
.lien-card.nouveau{border-left:3px solid var(--bordeaux);background:linear-gradient(135deg,rgba(163,33,95,0.03),var(--white));}
.lien-icon{width:40px;height:40px;border-radius:var(--radius-md);background:var(--bordeaux-bg);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.lien-info{flex:1;min-width:0;}
.lien-name{font-weight:600;font-size:13px;color:var(--navy);}
.lien-ref{font-size:11px;color:var(--text-tertiary);font-family:monospace;}
.new-badge{background:var(--bordeaux);color:white;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;}
/* Questionnaire */
.q-field{margin-bottom:16px;}
.q-label{font-size:13px;font-weight:600;color:var(--navy);margin-bottom:6px;}
.q-sub{font-size:11px;color:var(--text-tertiary);margin-bottom:6px;}
.star-rating{display:flex;gap:6px;}
.star{font-size:24px;cursor:pointer;color:#d1d5db;transition:color .1s;}
.star.active{color:#f59e0b;}
</style>
</head>
<body>
<div class="login-page" id="login-page">
  <div class="login-box">
    <div class="login-logo"><img src="../assets/images/ICN-Junior-Conseil_logo.png" style="height:54px;object-fit:contain"/></div>
    <div class="login-title">Connexion</div>
    <div class="login-sub">Accès réservé aux membres ICN Junior Conseil.</div>
    <button class="google-btn" onclick="doGoogleLogin()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google"/>Se connecter avec Google
    </button>
    <div class="denied-box" id="denied-box"><strong>Accès refusé</strong><p id="denied-msg"></p></div>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div class="app-page" id="app-page">
  <div id="sidebar-container"></div>
  <div class="app-content">
    <div class="page-header">
      <div class="page-title">Mes missions</div>
      <div class="page-subtitle" id="page-subtitle"></div>
    </div>
    <div class="page-body">
      <div class="mission-tabs">
        <button class="mt-btn active" onclick="switchTab('actives')" id="mtt-actives">🎯 En cours</button>
        <button class="mt-btn" onclick="switchTab('historique')" id="mtt-historique">📋 Historique</button>
        <button class="mt-btn" onclick="switchTab('liens')" id="mtt-liens">📂 Mes liens <span id="new-count" style="display:none;background:var(--bordeaux);color:white;border-radius:99px;padding:1px 6px;font-size:10px;margin-left:4px"></span></button>
      </div>

      <!-- MISSIONS EN COURS -->
      <div class="mt-pane active" id="mtp-actives">
        <div id="actives-list"><div style="color:var(--text-tertiary)">Chargement…</div></div>
      </div>

      <!-- HISTORIQUE -->
      <div class="mt-pane" id="mtp-historique">
        <div id="historique-list"><div style="color:var(--text-tertiary)">Chargement…</div></div>
      </div>

      <!-- MES LIENS (documents) -->
      <div class="mt-pane" id="mtp-liens">
        <div id="liens-list"><div style="color:var(--text-tertiary)">Chargement…</div></div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL SUIVI MISSION -->
<div class="modal-overlay" id="modal-suivi" onclick="if(event.target===this)closeSuivi()">
  <div class="modal-box" style="max-width:560px">
    <div class="modal-header"><div class="modal-title" id="suivi-title">Suivi de mission</div><button class="modal-close" onclick="closeSuivi()">×</button></div>
    <div id="suivi-content"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeSuivi()">Fermer</button>
      <button class="btn btn-primary" onclick="saveSuivi()">Sauvegarder</button>
    </div>
  </div>
</div>

<!-- MODAL QUESTIONNAIRE -->
<div class="modal-overlay" id="modal-questionnaire" onclick="if(event.target===this)closeQuestionnaire()">
  <div class="modal-box" style="max-width:600px">
    <div class="modal-header"><div class="modal-title">Questionnaire de fin d'étude</div><button class="modal-close" onclick="closeQuestionnaire()">×</button></div>
    <div id="questionnaire-content"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeQuestionnaire()">Annuler</button>
      <button class="btn btn-primary" onclick="submitQuestionnaire()">Soumettre ✓</button>
    </div>
  </div>
</div>

<script>
var ME = '', MY_ROLE = '', MY_IV_ID = null;
var myMissions = [], myDocs = [], questionnaire = null;
var curSuiviId = null, curQuestId = null;

function fmtD(s){if(!s)return'—';var p=s.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s;}
function fmtM(n){return Number(n||0).toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:0})+' €';}

initAuth('mes_missions', function(user, role, profile) {
  ME = user.email; MY_ROLE = role;
  renderSidebar(role, profile, user, 'mes_missions');
  showAppPage(user, role, profile);
  updateHealthIndicator();
  var now = new Date();
  var M=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  document.getElementById('page-subtitle').innerText = (profile.prenom||user.displayName||'') + ' · ' + now.getDate()+' '+M[now.getMonth()]+' '+now.getFullYear();
  loadData(user.email);
});

function loadData(email) {
  // Trouver l'intervenant lié à cet email
  db.collection('intervenants').where('email','==',email).get().then(function(snap){
    if (!snap.empty) {
      MY_IV_ID = snap.docs[0].id;
    }
    // Charger les études où l'utilisateur est intervenant
    db.collection('etudes').onSnapshot(function(snap2){
      myMissions = [];
      snap2.forEach(function(doc){
        var e = Object.assign({id:doc.id},doc.data());
        var isIv = (e.intervenants||[]).some(function(i){
          return i.intervenant_id === MY_IV_ID || i.email === email;
        });
        if (isIv) myMissions.push(e);
      });
      renderMissions();
    });
  });

  // Documents
  if (MY_IV_ID) {
    db.collection('documents').where('intervenant_id','==',MY_IV_ID).onSnapshot(function(snap3){
      myDocs = [];
      snap3.forEach(function(doc){myDocs.push(Object.assign({id:doc.id},doc.data()));});
      renderLiens();
    });
  } else {
    db.collection('documents').where('intervenant_email','==',email).onSnapshot(function(snap3){
      myDocs = [];
      snap3.forEach(function(doc){myDocs.push(Object.assign({id:doc.id},doc.data()));});
      renderLiens();
    });
  }

  // Questionnaire actif
  db.collection('questionnaires').where('actif','==',true).limit(1).get().then(function(snap4){
    if (!snap4.empty) questionnaire = Object.assign({id:snap4.docs[0].id},snap4.docs[0].data());
  });
}

function switchTab(key) {
  ['actives','historique','liens'].forEach(function(k){
    document.getElementById('mtt-'+k).classList.toggle('active',k===key);
    document.getElementById('mtp-'+k).classList.toggle('active',k===key);
  });
}

function renderMissions() {
  var actives = myMissions.filter(function(e){return ['Signé','En cours'].includes(e.statut);});
  var done = myMissions.filter(function(e){return ['Livré','Facturé','Clôturé'].includes(e.statut);});
  renderMissionList(actives, 'actives-list', true);
  renderMissionList(done, 'historique-list', false);
}

function renderMissionList(list, containerId, isActive) {
  if (list.length === 0) {
    document.getElementById(containerId).innerHTML = '<div style="color:var(--text-tertiary);font-size:13px;text-align:center;padding:30px">'+
      (isActive?'Aucune mission en cours.':'Aucune mission terminée.')+'</div>';
    return;
  }
  var STATUT_CSS = {Signé:'s-signe','En cours':'s-encours',Livré:'s-livre',Clôturé:'s-cloture',Facturé:'s-livre'};
  document.getElementById(containerId).innerHTML = list.map(function(e){
    var myIv = (e.intervenants||[]).find(function(i){return i.intervenant_id===MY_IV_ID;}) || {};
    var sc = STATUT_CSS[e.statut]||'';
    var canQ = e.statut==='Livré' && questionnaire;
    return '<div class="mission-card '+(isActive?'active':'done')+'">' +
      '<div class="mc-header">' +
        '<div>' +
          '<div class="mc-ref">'+(e.reference||'—')+'</div>' +
          '<div class="mc-title">'+(e.title||'Sans titre')+'</div>' +
          '<div class="mc-client">🏢 '+(e.client_name||'—')+'</div>' +
        '</div>' +
        '<span class="badge '+sc+'">'+(e.statut||'—')+'</span>' +
      '</div>' +
      '<div class="mc-stats">' +
        '<div class="mc-stat"><div class="mc-stat-val">'+fmtD(e.date_debut)+'</div><div class="mc-stat-lbl">Début</div></div>' +
        '<div class="mc-stat"><div class="mc-stat-val">'+fmtD(e.date_fin)+'</div><div class="mc-stat-lbl">Fin prévue</div></div>' +
        (myIv.montant_brut?'<div class="mc-stat"><div class="mc-stat-val">'+fmtM(myIv.montant_brut)+'</div><div class="mc-stat-lbl">Rémunération brute</div></div>':'') +
      '</div>' +
      '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">' +
        '<button class="btn btn-secondary btn-sm" onclick="openSuivi(\''+e.id+'\')">📝 Suivi d\'avancement</button>' +
        (canQ?'<button class="btn btn-primary btn-sm" onclick="openQuestionnaire(\''+e.id+'\')">📋 Questionnaire fin d\'étude</button>':'') +
      '</div>' +
    '</div>';
  }).join('');
}

// ── Suivi avancement ──────────────────────────────────────────
function openSuivi(etudeId) {
  curSuiviId = etudeId;
  var e = myMissions.find(function(x){return x.id===etudeId;});
  if (!e) return;
  document.getElementById('suivi-title').innerText = 'Suivi — '+(e.reference||e.title||'');
  var myIv = (e.intervenants||[]).find(function(i){return i.intervenant_id===MY_IV_ID;}) || {};
  document.getElementById('suivi-content').innerHTML =
    '<div class="form-field"><label class="input-label">Avancement général (%)</label>' +
      '<input class="input" type="number" id="sv-pct" min="0" max="100" value="'+(myIv.avancement||0)+'" placeholder="0 à 100"/></div>' +
    '<div class="form-field"><label class="input-label">Commentaire / points d\'avancement</label>' +
      '<textarea class="input" id="sv-note" rows="4" style="resize:vertical" placeholder="Décris l\'avancement de ta mission, les difficultés éventuelles…">'+(myIv.suivi_note||'')+'</textarea></div>' +
    '<div class="form-field"><label class="input-label">Date dernière mise à jour</label>' +
      '<input class="input" type="date" id="sv-date" value="'+(myIv.suivi_date||new Date().toISOString().split('T')[0])+'"/></div>';
  document.getElementById('modal-suivi').classList.add('open');
}

function closeSuivi() { document.getElementById('modal-suivi').classList.remove('open'); curSuiviId = null; }

function saveSuivi() {
  if (!curSuiviId) return;
  var e = myMissions.find(function(x){return x.id===curSuiviId;});
  if (!e) return;
  var ivs = JSON.parse(JSON.stringify(e.intervenants||[]));
  var idx = ivs.findIndex(function(i){return i.intervenant_id===MY_IV_ID;});
  if (idx>=0){
    ivs[idx].avancement = parseInt(document.getElementById('sv-pct').value)||0;
    ivs[idx].suivi_note = document.getElementById('sv-note').value.trim();
    ivs[idx].suivi_date = document.getElementById('sv-date').value;
  }
  db.collection('etudes').doc(curSuiviId).update({intervenants:ivs}).then(function(){
    closeSuivi();
  });
}

// ── Questionnaire ─────────────────────────────────────────────
function openQuestionnaire(etudeId) {
  if (!questionnaire) { alert('Aucun questionnaire actif.'); return; }
  curQuestId = etudeId;
  var questions = questionnaire.questions || [];
  document.getElementById('questionnaire-content').innerHTML =
    '<p style="font-size:13px;color:var(--text-secondary);margin-bottom:16px">Questionnaire de fin d\'étude. Tes réponses seront transmises au responsable qualité.</p>' +
    questions.map(function(q,i){
      var input = '';
      if (q.type === 'texte') {
        input = '<textarea class="input" id="q-'+i+'" rows="3" style="resize:vertical" placeholder="Ta réponse…"></textarea>';
      } else if (q.type === 'note') {
        input = '<div class="star-rating" id="q-'+i+'">' +
          [1,2,3,4,5].map(function(n){return '<span class="star" onclick="setStar('+i+','+n+')">★</span>';}).join('') +
          '</div>';
      } else if (q.type === 'oui_non') {
        input = '<div style="display:flex;gap:10px">' +
          '<label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer"><input type="radio" name="q'+i+'" id="q-'+i+'-oui" value="Oui"/> Oui</label>' +
          '<label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer"><input type="radio" name="q'+i+'" id="q-'+i+'-non" value="Non"/> Non</label>' +
          '</div>';
      } else if (q.type === 'choix') {
        input = (q.options||[]).map(function(opt){
          return '<label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;margin-bottom:4px"><input type="checkbox" name="q'+i+'" value="'+opt+'"/> '+opt+'</label>';
        }).join('');
      }
      return '<div class="q-field">' +
        '<div class="q-label">'+(i+1)+'. '+q.question+'</div>' +
        (q.description?'<div class="q-sub">'+q.description+'</div>':'') +
        input+'</div>';
    }).join('');
  document.getElementById('modal-questionnaire').classList.add('open');
}

function closeQuestionnaire() { document.getElementById('modal-questionnaire').classList.remove('open'); curQuestId = null; }

function setStar(qIdx, n) {
  var stars = document.querySelectorAll('#q-'+qIdx+' .star');
  stars.forEach(function(s,i){s.classList.toggle('active',i<n);});
  document.getElementById('q-'+qIdx).dataset.val = n;
}

function submitQuestionnaire() {
  if (!curQuestId || !questionnaire) return;
  var questions = questionnaire.questions || [];
  var reponses = questions.map(function(q,i){
    var val = '';
    if (q.type==='texte') { var el=document.getElementById('q-'+i); val=el?el.value.trim():''; }
    else if (q.type==='note') { var el2=document.getElementById('q-'+i); val=el2?el2.dataset.val||0:0; }
    else if (q.type==='oui_non') { var oui=document.getElementById('q-'+i+'-oui'); val=oui&&oui.checked?'Oui':'Non'; }
    else if (q.type==='choix') {
      var checked = document.querySelectorAll('input[name="q'+i+'"]:checked');
      val = Array.from(checked).map(function(c){return c.value;}).join(', ');
    }
    return {question:q.question,reponse:val};
  });
  db.collection('questionnaire_reponses').add({
    questionnaire_id: questionnaire.id,
    etude_id: curQuestId,
    intervenant_id: MY_IV_ID,
    intervenant_email: ME,
    reponses: reponses,
    soumis_le: new Date().toISOString().split('T')[0],
    created_at: firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    closeQuestionnaire();
    alert('✅ Questionnaire soumis. Merci !');
  });
}

// ── Mes liens (documents) ─────────────────────────────────────
function renderLiens() {
  var newCount = myDocs.filter(function(d){return !d.vu_par_intervenant && d.lien_gdrive;}).length;
  var nc = document.getElementById('new-count');
  if (newCount > 0) { nc.style.display=''; nc.innerText=newCount; } else { nc.style.display='none'; }

  var ICONS = {RM:'📄',CE:'📋',BV:'💰',questionnaire:'📝'};
  if (myDocs.length === 0) {
    document.getElementById('liens-list').innerHTML = '<div style="color:var(--text-tertiary);font-size:13px;text-align:center;padding:30px">Aucun document disponible pour le moment.</div>';
    return;
  }
  document.getElementById('liens-list').innerHTML = myDocs.map(function(d){
    var isNew = !d.vu_par_intervenant && d.lien_gdrive;
    var haslien = !!d.lien_gdrive;
    return '<div class="lien-card '+(isNew?'nouveau':'')+'">' +
      '<div class="lien-icon">'+(ICONS[d.type]||'📎')+'</div>' +
      '<div class="lien-info">' +
        '<div style="display:flex;align-items:center;gap:8px">' +
          '<div class="lien-name">'+(d.nom_affiche||d.type||'Document')+'</div>' +
          (isNew?'<span class="new-badge">Nouveau</span>':'') +
        '</div>' +
        '<div class="lien-ref">'+(d.etude_ref||'')+'</div>' +
        (!haslien?'<div style="font-size:11px;color:var(--text-tertiary);margin-top:2px">En attente de mise en ligne par le responsable qualité</div>':'') +
      '</div>' +
      (haslien?'<a href="'+d.lien_gdrive+'" target="_blank" onclick="markVu(\''+d.id+'\')" class="btn btn-primary btn-sm">📥 Ouvrir</a>':'') +
    '</div>';
  }).join('');
}

function markVu(docId) {
  db.collection('documents').doc(docId).update({vu_par_intervenant:true});
}
</script>
</body>
</html>
