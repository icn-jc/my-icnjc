<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accueil — My-ICN-JC</title>
<link rel="icon" href="assets/logo-mark.png"><link rel="stylesheet" href="assets/app.css">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="assets/core.js"></script>
</head>
<body>
<main hidden>
  <div class="page-head"><div><h1 id="hello"></h1><div class="sub" id="sub"></div></div></div>
  <div id="alerts"></div>
  <div id="snapshot"></div>
  <div class="grid2" id="lists" style="margin-top:8px"></div>
</main>
<script>
const S = { prospects: [], rdvs: [], etudes: [], factures: [], docs: [], mandats: [], users: [] };
let ME, FIN;

App.start('index', () => {
  ME = App.user.email;
  // Les chiffres financiers ne sont montrés qu'aux membres internes du CA (jamais aux externes)
  FIN = App.isCA() && !App.user.externe;
  const h = new Date().getHours();
  document.getElementById('hello').textContent = (h < 18 ? 'Bonjour ' : 'Bonsoir ') + App.user.prenom;
  document.getElementById('sub').textContent = longDate();
  const col = n => db.collection(n);
  watch(col('prospects'), l => { S.prospects = l; render(); });
  watch(col('prospects_rdv'), l => { S.rdvs = l; render(); });
  if (App.can('etudes') || FIN) watch(col('etudes'), l => { S.etudes = l; render(); });
  if (App.can('compta') || FIN) watch(col('factures'), l => { S.factures = l; render(); });
  if (App.can('documents')) watch(col('documents'), l => { S.docs = l; render(); });
  if (FIN) { getAll(col('mandats')).then(l => { S.mandats = l; render(); }); getAll(col('users')).then(l => { S.users = l; render(); }); }
});

function render() {
  const t = today(), alerts = [];
  const mine = S.prospects.filter(p => p.owner_email === ME);
  const due = mine.filter(p => p.next_action_at && p.next_action_at <= t && !['Signé', 'Perdu'].includes(p.status));
  const rdvTodo = S.rdvs.filter(r => !r.signe && r.date && r.date < t && r.owner_email === ME);
  if (rdvTodo.length) alerts.push(['bad', rdvTodo.length + ' compte(s) rendu(s) de RDV à remplir', 'prospection.html']);
  if (due.length) alerts.push(['warn', due.length + ' prospect(s) à relancer aujourd’hui', 'prospection.html']);
  if (App.canEdit('etudes')) { const n = S.etudes.filter(e => e.a_completer).length; if (n) alerts.push(['warn', n + ' étude(s) à compléter (phases, dates, responsable)', 'etudes.html']); }
  if (App.canEdit('compta')) {
    const late = S.factures.filter(f => f.statut === 'Impayée' || (f.statut === 'En attente' && f.date_echeance && f.date_echeance < t));
    if (late.length) alerts.push(['bad', late.length + ' facture(s) en retard de paiement — ' + eur(late.reduce((a, f) => a + num(f.montant_ht), 0)), 'compta.html']);
  }
  if (App.can('documents')) { const n = S.docs.filter(d => !d.lien_gdrive).length; if (n) alerts.push(['info', n + ' document(s) intervenant sans lien GDrive', 'documents.html']); }
  if (FIN && S.users.length) {
    const active = S.users.filter(u => u.prospecte).map(u => u.email || u.id);
    const orphans = S.prospects.filter(p => STATUTS_OUVERTS.includes(p.status) && !active.includes(p.owner_email));
    if (orphans.length) alerts.push(['info', orphans.length + ' prospect(s) orphelin(s) à réaffecter', 'prospection.html']);
  }
  document.getElementById('alerts').innerHTML = alerts.length ? alerts.map(a => '<div class="alert ' + a[0] + '"><span>' + esc(a[1]) + '</span><a href="' + a[2] + '">Voir</a></div>').join('')
    : '<div class="alert info"><span>Rien d’urgent aujourd’hui.</span></div>';

  // Indicateurs du mandat en cours (CA uniquement)
  const m = S.mandats.find(x => x.statut === 'actif');
  if (FIN && m) {
    const s = mandatStats(m, S);
    const open = S.prospects.filter(p => STATUTS_OUVERTS.includes(p.status));
    document.getElementById('snapshot').innerHTML = '<h2 class="section-title">Mandat ' + esc(m.label || m.id) + '</h2><div class="kpis">' +
      '<div class="kpi accent"><div class="v">' + eur(s.caSigne.v) + '</div><div class="l">CA signé</div></div>' +
      '<div class="kpi"><div class="v">' + eur(s.caEnc.v) + '</div><div class="l">CA encaissé</div><div class="s">' + s.transfo.v + ' % du signé</div></div>' +
      '<div class="kpi"><div class="v">' + S.etudes.filter(e => e.statut === 'En cours').length + '</div><div class="l">Études en cours</div></div>' +
      '<div class="kpi"><div class="v">' + s.tauxConv.v + ' %</div><div class="l">Taux de conversion</div><div class="s">' + s.contactes.v + ' prospects contactés</div></div>' +
      '<div class="kpi"><div class="v">' + eur(open.reduce((a, p) => a + num(p.estimated_amount), 0)) + '</div><div class="l">Pipeline</div></div>' +
      (s.cash ? '<div class="kpi"><div class="v">' + eur(s.cash) + '</div><div class="l">Cash disponible</div></div>' : '') + '</div>';
  } else document.getElementById('snapshot').innerHTML = '';

  // Listes personnelles
  const lists = [];
  if (App.user.prospecte || mine.length) {
    const l = mine.filter(p => !['Signé', 'Perdu'].includes(p.status)).sort((a, b) => (a.next_action_at || '9999').localeCompare(b.next_action_at || '9999')).slice(0, 6);
    lists.push('<div class="card"><h3>Mes prochaines relances</h3>' + (l.length ? '<div class="list">' + l.map(p => '<a class="row" style="color:inherit;padding:6px 0;border-bottom:1px solid var(--line)" href="prospection.html"><b class="grow">' + esc(p.company_name) + '</b>' +
      '<span class="badge ' + (STATUT_BADGE[p.status] || '') + '">' + esc(p.status) + '</span><span class="muted" style="width:80px;text-align:right">' + (p.next_action_at ? fmtDate(p.next_action_at) : '—') + '</span></a>').join('') + '</div>' : '<div class="muted">Aucun prospect en cours.</div>') + '</div>');
  }
  const myEtudes = S.etudes.filter(e => e.responsable_email === ME && ['Signé', 'En cours'].includes(e.statut));
  if (myEtudes.length) lists.push('<div class="card"><h3>Mes études en cours</h3><div class="list">' + myEtudes.map(e => '<a class="row" style="color:inherit;padding:6px 0;border-bottom:1px solid var(--line)" href="etudes.html"><span class="ref">' + esc(e.reference || '—') + '</span><span class="grow">' + esc(e.client_name || '') + '</span><span class="muted">fin ' + fmtDate(e.date_fin) + '</span></a>').join('') + '</div></div>');
  document.getElementById('lists').innerHTML = lists.join('');
}
</script>
</body>
</html>
